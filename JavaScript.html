<script>
(function () {
  'use strict';

  // ───────────── Config ─────────────
  var POSITIONS = [
    { key: 'CGL', label: 'CGL', color: '#1e40af' },
    { key: 'SPONSOR', label: 'Sponsor', color: '#2563eb' },
    { key: 'MEMBER', label: 'Member', color: '#38bdf8' },
    { key: 'SIMPATISAN', label: 'Simpatisan', color: '#93c5fd' },
    { key: 'VIP', label: 'VIP', color: '#a5b4fc' },
    { key: 'OTHER', label: 'Lainnya', color: '#cbd5e1' },
  ];
  var ACCENTS = [
    'linear-gradient(135deg,#2563eb,#38bdf8)',
    'linear-gradient(135deg,#1e40af,#60a5fa)',
    'linear-gradient(135deg,#0284c7,#7dd3fc)',
    'linear-gradient(135deg,#4f46e5,#38bdf8)',
    'linear-gradient(135deg,#0b2a6f,#3b82f6)',
    'linear-gradient(135deg,#0ea5e9,#a5b4fc)',
  ];
  var ICON = {
    arrow: '<svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
    close: '<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    check: '<svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    clock: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    pin: '<svg class="i" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
    wifi: '<svg class="i" viewBox="0 0 24 24"><path d="M4 9.5a12 12 0 0 1 16 0M7 13a7.5 7.5 0 0 1 10 0M10 16.5a3 3 0 0 1 4 0"/><circle cx="12" cy="19.5" r=".8"/></svg>',
    users: '<svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></svg>',
    wa: '<svg class="i" viewBox="0 0 24 24"><path d="M4 20l1.3-4A8 8 0 1 1 8 18.7z"/><path d="M9 9.5c.3 1.8 2.6 4.2 4.5 4.6l1.3-1.2 1.7.9c-.3 1.2-1.3 1.8-2.4 1.6-2.8-.5-5.5-3.2-6-6-.2-1.1.4-2.1 1.6-2.4l.9 1.7z"/></svg>',
    phone: '<svg class="i" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>',
    mail: '<svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 6.5l8.5 6 8.5-6"/></svg>',
    sheet: '<svg class="i" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M4 9h16M4 15h16M10 3v18"/></svg>',
    warn: '<svg class="i" viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg>',
    edit: '<svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
    save: '<svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    cal: '<svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  };
  /** LDP steps; same keys as LDP_STEPS in Ldp.gs. */
  var LDP_STEPS = [
    { key: 'member', label: 'Member', target: 'targetMember', date: 'dateMember' },
    { key: 'sponsor', label: 'Sponsor', target: 'targetSponsor', date: 'dateSponsor' },
    { key: 'cgl', label: 'CGL', target: 'targetCgl', date: 'dateCgl' },
    { key: 'coach', label: 'Coach', target: 'targetCoach', date: 'dateCoach' },
    { key: 'tl', label: 'Team Leader', target: 'targetTl', date: 'dateTl' },
  ];
  var POSITION_LABEL = { VIP: 'VIP', SIMPATISAN: 'Simpatisan', MEMBER: 'Member', SPONSOR: 'Sponsor', CGL: 'CGL' };

  var state = {
    data: null, coaches: [], byId: {}, people: [],
    drawer: { coach: null, tab: 'cg', pos: 'ALL', status: 'ALL' },
    search: { results: [], active: -1 },
    edit: null, // { id, draft: { milestones, position, ...fields }, saving }
    token: '',
  };

  // ───────────── Session ─────────────
  var TOKEN_KEY = 'aogpuri.session';
  function readToken() {
    try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; }
  }
  function saveToken(t) {
    state.token = t || '';
    try { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); } catch (e) { /* private mode */ }
  }
  function errText(err) {
    return String((err && err.message) || err || '').replace(/^(Exception|Error):\s*/, '');
  }

  /** Server call that sends the session token and returns to the login screen when it's rejected. */
  function api(fn) {
    var args = [fn, state.token].concat(Array.prototype.slice.call(arguments, 1));
    return callServer.apply(null, args).catch(function (err) {
      var msg = errText(err);
      if (msg.indexOf('AUTH:') >= 0) {
        signOut(msg.replace(/^.*AUTH:\s*/, ''));
        err.isAuth = true;
      }
      throw err;
    });
  }

  /** Promise wrapper around google.script.run. */
  function callServer(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      if (!(window.google && google.script && google.script.run)) {
        reject(new Error('google.script.run tidak tersedia.'));
        return;
      }
      var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      runner[fn].apply(runner, args);
    });
  }

  // ───────────── Helpers ─────────────
  function $(s, root) { return (root || document).querySelector(s); }
  function $$(s, root) { return Array.prototype.slice.call((root || document).querySelectorAll(s)); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function initials(name) {
    var parts = String(name || '?').trim().split(/\s+/);
    return ((parts[0] || '')[0] + (parts.length > 1 ? parts[parts.length - 1][0] : (parts[0] || '')[1] || '')).toUpperCase();
  }
  function posKey(p) { return POSITIONS.some(function (x) { return x.key === p; }) ? p : 'OTHER'; }
  function posInfo(p) { var k = posKey(p); return POSITIONS.filter(function (x) { return x.key === k; })[0]; }
  function isActive(p) { return /^aktif$/i.test(p.status); }
  function msDone(p) { return state.data.milestones.filter(function (m) { return p.milestones[m.key]; }).length; }
  function msPct(p) { return Math.round(msDone(p) / state.data.milestones.length * 100); }
  function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }
  /** Average attendance % of the people that have it, or null. */
  function avgAttendance(list) {
    var xs = list.filter(function (p) { return p.attendancePct != null; });
    return xs.length ? Math.round(xs.reduce(function (s, p) { return s + p.attendancePct; }, 0) / xs.length) : null;
  }
  function attendanceText(p) {
    if (p.attendancePct == null) return '';
    return 'Hadir ' + (p.attendance != null ? p.attendance + 'x · ' : '') + p.attendancePct + '%';
  }
  /** "AOG 03 · CGL Candyce Wie · Coach Christian" (or "Team Leader"). */
  function whoLine(p, withCgl) {
    if (p.isLeader) return 'Team Leader';
    return [p.cg, withCgl && p.cgl && p.position !== 'CGL' ? 'CGL ' + p.cgl : '', p.coach ? 'Coach ' + p.coach : ''].filter(Boolean).join(' · ');
  }
  function waLink(phone) {
    var d = String(phone || '').replace(/\D/g, '');
    if (!d) return '';
    if (d[0] === '0') d = '62' + d.slice(1);
    else if (d[0] === '8') d = '62' + d;
    return 'https://wa.me/' + d;
  }
  function posBadge(p) {
    var info = posInfo(p.position);
    var staff = p.position === 'COACH' || p.position === 'TEAM LEADER';
    var label = p.position === 'COACH' ? 'Coach' : p.position === 'TEAM LEADER' ? 'Team Leader'
      : (info.key === 'OTHER' ? (p.position === 'UNKNOWN' ? '—' : p.position) : info.label);
    var light = ['MEMBER', 'SIMPATISAN', 'VIP', 'OTHER'].indexOf(info.key) >= 0 && !staff;
    var bg = p.position === 'TEAM LEADER' ? 'linear-gradient(135deg,#0b2a6f,#2563eb)' : p.position === 'COACH' ? '#0b2a6f' : info.color;
    return '<span class="badge" style="background:' + bg + ';color:' + (light ? '#0b2a6f' : '#fff') + '">' + esc(label) + '</span>';
  }
  function statusBadge(p) {
    return '<span class="badge ' + (isActive(p) ? 'status-on' : 'status-off') + '">' + esc(p.status) + '</span>';
  }
  function countUp(el, to, suffix) {
    suffix = suffix || '';
    var start = performance.now(), dur = 900;
    function tick(now) {
      var t = Math.min(1, (now - start) / dur);
      var e = 1 - Math.pow(1 - t, 3);
      el.textContent = Math.round(to * e) + suffix;
      if (t < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }
  function toast(msg, isError) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.toggle('error', !!isError);
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.remove('show'); }, isError ? 5000 : 2400);
  }
  function stackBar(counts, total) {
    return '<div class="stack">' + POSITIONS.map(function (p, i) {
      var n = counts[p.key] || 0;
      if (!n) return '';
      return '<i title="' + esc(p.label + ': ' + n) + '" style="width:' + (n / total * 100) + '%;background:' + p.color + ';animation-delay:' + (i * 60) + 'ms"></i>';
    }).join('') + '</div>';
  }
  function updateLock() {
    var open = $('#drawer').classList.contains('open') || $('#modalWrap').classList.contains('open') ||
      !!document.querySelector('#mtModalWrap.open, #ldpModalWrap.open, #locModalWrap.open, #cgModalWrap.open, #rsModalWrap.open, #mulModalWrap.open, #visitModalWrap.open');
    document.body.classList.toggle('locked', open);
  }

  // ───────────── Data ─────────────
  function load(isRefresh) {
    if (!state.token) { showLogin(''); return; }
    $('#refreshBtn').classList.add('spinning');
    api('getDashboardData').then(function (d) { onData(d, isRefresh); }, function (err) {
      $('#refreshBtn').classList.remove('spinning');
      if (!err.isAuth) onError(err);
    });
  }

  function onError(err) {
    $('#refreshBtn').classList.remove('spinning');
    $('#heroEyebrow').textContent = 'Gagal memuat';
    $('#heroStats').innerHTML = '';
    $('#coachGrid').innerHTML =
      '<div class="error-card" style="grid-column:1/-1"><b>Data tidak bisa dimuat.</b><br><span class="small">' +
      esc(errText(err)) +
      '</span><br><br><span class="small muted">Coba refresh. Kalau masih gagal, hubungi team leader.</span></div>';
  }

  function onData(data, isRefresh, quiet) {
    $('#refreshBtn').classList.remove('spinning');
    state.data = data;
    state.people = data.people;
    state.byId = {};
    data.people.forEach(function (p) { state.byId[p.id] = p; });
    state.coaches = data.coaches.map(buildCoach);

    $('#sheetLink').href = data.spreadsheetUrl || '#';
    $('#sheetLink').style.display = data.spreadsheetUrl ? '' : 'none';
    renderUser(data.user);
    enterApp();
    $('#brandSub').textContent = 'Coach Dashboard · ' + data.sheetName;
    renderHero();
    renderWarnings();
    renderCoaches();
    renderComposition();
    renderGaps();
    if (window.AOGCg) window.AOGCg.onData();
    if (window.AOGMultiply) window.AOGMultiply.onData();
    if (window.AOGVisits) window.AOGVisits.onData();
    if (!quiet && window.AOGMeetings) window.AOGMeetings.onDashboard();
    if (!quiet && window.AOGLdp) window.AOGLdp.onDashboard();
    if (!quiet && window.AOGLocations) window.AOGLocations.onDashboard();
    if (!quiet && window.AOGVisits) window.AOGVisits.onDashboard();
    var when = new Date(data.generatedAt);
    $('#foot').textContent = 'Sumber: tab "' + data.sheetName + '" · diperbarui ' +
      when.toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });

    if (state.drawer.coach) {
      var still = state.coaches.filter(function (c) { return c.key === state.drawer.coach; })[0];
      if (still) renderDrawer(); else closeDrawer();
    }
    if (isRefresh) toast('Data diperbarui ✨');
  }

  function buildCoach(c, idx) {
    var all = state.people.filter(function (p) { return p.coach === c.key; });
    var members = all.filter(function (p) { return !p.isCoach; });
    var counts = {};
    members.forEach(function (p) { var k = posKey(p.position); counts[k] = (counts[k] || 0) + 1; });
    var cgMap = {};
    members.forEach(function (p) {
      var key = p.cg || 'Tanpa CG';
      (cgMap[key] = cgMap[key] || []).push(p);
    });
    var cgs = Object.keys(cgMap).sort(function (a, b) {
      return a.localeCompare(b, 'id', { numeric: true });
    }).map(function (code) {
      var list = cgMap[code];
      var order = POSITIONS.map(function (x) { return x.key; });
      list.sort(function (a, b) { return order.indexOf(posKey(a.position)) - order.indexOf(posKey(b.position)) || a.name.localeCompare(b.name); });
      var leader = list.filter(function (p) { return p.position === 'CGL'; })[0];
      var first = list[0];
      return {
        code: code, people: list,
        cgl: (leader && leader.name) || first.cgl || '',
        time: cgInfo(list, 'cgTime'), area: cgInfo(list, 'cgArea'), mode: cgInfo(list, 'cgStatus'),
        active: list.filter(isActive).length,
        attendance: avgAttendance(list),
      };
    });
    var gaps = {};
    state.data.milestones.forEach(function (m) {
      gaps[m.key] = members.filter(function (p) { return !p.milestones[m.key]; });
    });
    var avg = members.length ? Math.round(members.reduce(function (s, p) { return s + msPct(p); }, 0) / members.length) : 0;
    return {
      key: c.key, name: c.name, fullName: c.fullName,
      accent: ACCENTS[idx % ACCENTS.length],
      all: all, members: members, counts: counts, cgs: cgs.filter(function (g) { return g.code !== 'Tanpa CG'; }),
      cgGroups: cgs, gaps: gaps, avg: avg,
      active: members.filter(isActive).length,
      serving: members.filter(function (p) { return !!p.ministry; }).length,
      attendance: avgAttendance(members),
    };
  }

  // ───────────── Render: main ─────────────
  function renderHero() {
    var members = state.people.filter(function (p) { return !p.isCoach; });
    var active = members.filter(isActive).length;
    var cgSet = {};
    members.forEach(function (p) { if (p.cg) cgSet[p.cg] = 1; });
    var cgl = members.filter(function (p) { return p.position === 'CGL'; }).length;
    var sponsor = members.filter(function (p) { return p.position === 'SPONSOR'; }).length;
    var serving = members.filter(function (p) { return !!p.ministry; }).length;

    var u = state.data.user || {};
    $('#heroEyebrow').textContent = u.isAdmin ? 'Live · ' + state.coaches.length + ' coach'
      : u.isTl ? 'Live · TL ' + (u.coach || '') + ' · ' + state.coaches.length + ' coach' : 'Live · Coach ' + (u.coach || '');
    var tl = state.data.teamLeaders || [];
    $('#heroSub').textContent = (tl.length ? 'Team Leader: ' + tl.join(', ') + '. ' : '') +
      'Ringkasan jemaat per coach, CG, dan perjalanan bertumbuh.';
    var avgHadir = avgAttendance(members);
    var stats = [
      { n: members.length, label: 'Total Jiwa', hint: active + ' aktif' + (avgHadir != null ? ' · hadir rata-rata ' + avgHadir + '%' : '') },
      { n: Object.keys(cgSet).length, label: 'Connect Group', hint: 'rata-rata ' + (Object.keys(cgSet).length ? Math.round(members.length / Object.keys(cgSet).length) : 0) + ' / CG' },
      { n: cgl + sponsor, label: 'Leaders', hint: cgl + ' CGL · ' + sponsor + ' Sponsor' },
      { n: pct(serving, members.length), suffix: '%', label: 'Sudah Melayani', hint: serving + ' orang di pelayanan' },
    ];
    $('#heroStats').innerHTML = stats.map(function (s) {
      return '<div class="stat"><div class="stat-num" data-n="' + s.n + '" data-s="' + (s.suffix || '') + '">0</div>' +
        '<div class="stat-label">' + esc(s.label) + '</div><div class="stat-hint">' + esc(s.hint) + '</div></div>';
    }).join('');
    $$('#heroStats .stat-num').forEach(function (el) { countUp(el, +el.dataset.n, el.dataset.s); });
  }

  function renderWarnings() {
    $('#warnings').innerHTML = (state.data.warnings || []).map(function (w) {
      return '<div class="warn">' + ICON.warn + '<span>' + esc(w) + '</span></div>';
    }).join('');
  }

  function renderCoaches() {
    $('#coachCount').textContent = state.coaches.length + ' coach';
    $('#coachGrid').innerHTML = state.coaches.map(function (c, i) {
      var total = c.members.length || 1;
      return '<button class="coach-card" data-coach="' + esc(c.key) + '" style="--accent:' + c.accent + ';animation-delay:' + (i * 70) + 'ms">' +
        '<div class="cc-top"><div class="avatar">' + esc(initials(c.fullName || c.name)) + '</div>' +
        '<div><div class="cc-name">' + esc(c.name) + '</div><div class="cc-full">' + esc(c.fullName || 'Coach') + '</div></div>' +
        '<div class="cc-arrow">' + ICON.arrow + '</div></div>' +
        '<div class="cc-stats">' +
        '<div class="cc-stat"><b>' + c.members.length + '</b><span>Jiwa</span></div>' +
        '<div class="cc-stat"><b>' + c.cgs.length + '</b><span>CG</span></div>' +
        '<div class="cc-stat"><b>' + pct(c.active, c.members.length) + '%</b><span>Aktif</span></div>' +
        '</div>' + stackBar(c.counts, total) +
        '<div class="cc-foot"><span>' + (c.counts.CGL || 0) + ' CGL · ' + (c.counts.SPONSOR || 0) + ' Sponsor</span><span>Growth ' + c.avg + '%' + (c.attendance != null ? ' · Hadir ' + c.attendance + '%' : '') + '</span></div>' +
        '</button>';
    }).join('') || '<div class="empty">Belum ada data.</div>';
  }

  function renderComposition() {
    var present = POSITIONS.filter(function (p) {
      return state.coaches.some(function (c) { return c.counts[p.key]; });
    });
    $('#positionLegend').innerHTML = present.map(function (p) {
      return '<span><i style="background:' + p.color + '"></i>' + esc(p.label) + '</span>';
    }).join('');
    var max = Math.max.apply(null, state.coaches.map(function (c) { return c.members.length; }).concat([1]));
    $('#compositionChart').innerHTML = state.coaches.map(function (c) {
      return '<div class="comp-row"><b>' + esc(c.name) + '</b>' +
        '<div style="width:' + Math.max(8, c.members.length / max * 100) + '%">' + stackBar(c.counts, c.members.length || 1) + '</div>' +
        '<span class="num">' + c.members.length + '</span></div>';
    }).join('');
  }

  function renderGaps() {
    var ms = state.data.milestones;
    var head = '<thead><tr><th>Milestone</th>' + state.coaches.map(function (c) {
      return '<th>' + esc(c.name) + '</th>';
    }).join('') + '<th>Total</th></tr></thead>';
    var body = '', lastGroup = '';
    ms.forEach(function (m) {
      if (m.group !== lastGroup) {
        lastGroup = m.group;
        body += '<tr class="grp"><td colspan="' + (state.coaches.length + 2) + '">' + esc(m.group) + '</td></tr>';
      }
      var total = 0, totalMembers = 0;
      var cells = state.coaches.map(function (c) {
        var n = c.gaps[m.key].length;
        total += n; totalMembers += c.members.length;
        return heatCell(n, c.members.length);
      }).join('');
      body += '<tr><td>' + esc(m.label) + '</td>' + cells + heatCell(total, totalMembers) + '</tr>';
    });
    $('#gapTable').innerHTML = head + '<tbody>' + body + '</tbody>';
  }
  function heatCell(n, of) {
    if (!n) return '<td class="cell zero">0</td>';
    var r = of ? n / of : 0;
    var bg = 'rgba(37,99,235,' + (0.08 + r * 0.82).toFixed(2) + ')';
    return '<td class="cell" title="' + n + ' dari ' + of + '" style="background:' + bg + ';color:' + (r > 0.45 ? '#fff' : '#1e3a8a') + '">' + n + '</td>';
  }

  // ───────────── Drawer ─────────────
  /**
   * A CG's schedule / status / area: taken from the CGL's row; without a CGL
   * (or an empty cell there), the most common value among the members.
   */
  function cgInfo(list, key) {
    var cgl = list.filter(function (p) { return p.position === 'CGL' && p[key]; })[0];
    if (cgl) return cgl[key];
    var counts = {}, best = '', n = 0;
    list.forEach(function (p) {
      if (!p[key]) return;
      counts[p[key]] = (counts[p[key]] || 0) + 1;
      if (counts[p[key]] > n) { n = counts[p[key]]; best = p[key]; }
    });
    return best;
  }

  function openCoach(key) {
    state.drawer = { coach: key, tab: 'cg', pos: 'ALL', status: 'ALL' };
    renderDrawer();
    $('#drawer').classList.add('open');
    $('#drawer').setAttribute('aria-hidden', 'false');
    $('#drawerScrim').classList.add('open');
    $('#drawerBody').scrollTop = 0;
    updateLock();
  }
  function closeDrawer() {
    $('#drawer').classList.remove('open');
    $('#drawer').setAttribute('aria-hidden', 'true');
    $('#drawerScrim').classList.remove('open');
    state.drawer.coach = null;
    updateLock();
  }
  function currentCoach() {
    return state.coaches.filter(function (c) { return c.key === state.drawer.coach; })[0];
  }

  function renderDrawer() {
    var c = currentCoach();
    if (!c) return;
    $('#drawer').style.setProperty('--accent', c.accent);
    $('#drawerBody').innerHTML =
      '<div class="drawer-hero"><div class="dh-row">' +
      '<div class="avatar lg">' + esc(initials(c.fullName || c.name)) + '</div>' +

  function moveTabIndicator() {

  function miniPerson(p) {

      '<span class="dot" style="background:' + info.color + '">' + esc(initials(p.name)) + '</span>' + esc(p.name.split(' ')[0]) + '</button>';

  function renderCgTab(c) {
    if (!c.cgGroups.length) return '<div class="empty">Belum ada CG.</div>';
    return c.cgGroups.map(function (g, i) {
      var meta = [];

      if (g.attendance != null) meta.push('<span>' + ICON.check + 'rata-rata hadir ' + g.attendance + '%</span>');

  function renderPeopleTab(c) {
    var d = state.drawer;

    c.members.forEach(function (p) { var k = posKey(p.position); counts[k] = (counts[k] || 0) + 1; });

      .map(function (p) {

          '<span class="count">' + counts[p.key] + '</span></button>';

    var statusChips = [['ALL', 'Semua status'], ['ON', 'Aktif'], ['OFF', 'Non-Aktif']].map(function (s) {

  function personRow(p, i) {

      posBadge(p) + '<div class="ring" style="--p:' + pc + '" title="Growth ' + pc + '%">' + pc + '%</div></button>';

  function renderGrowthTab(c) {

      if (m.group !== last) { last = m.group; html += '<div class="ms-group-label">' + esc(m.group) + '</div>'; }

          : '<div class="cg-members"><span class="small muted">Semua sudah 🎉</span></div>') +

  // ───────────── Modal ─────────────
  function openPerson(id) {
    var p = state.byId[id];
    if (!p) return;
    if (state.edit && state.edit.id !== id && !confirmDiscard()) return;
    state.edit = null;
    $('#modal').innerHTML = renderPerson(p);
    $('#modal').scrollTop = 0;
    $('#modalWrap').classList.add('open');
    $('#modalWrap').setAttribute('aria-hidden', 'false');
    closeSearch();
    updateLock();
  }
  function closeModal() {
    if (state.edit && state.edit.saving) return;
    if (state.edit && !confirmDiscard()) return;
    state.edit = null;
    $('#modalWrap').classList.remove('open');
    $('#modalWrap').setAttribute('aria-hidden', 'true');
    updateLock();
  }
  function confirmDiscard() {
    return !countChanges() || window.confirm('Buang perubahan yang belum disimpan?');
  }

  // ───────────── Edit mode ─────────────
  function startEdit(id) {
    var p = state.byId[id];
    if (!p) return;
    var draft = { milestones: {}, position: p.position };
    state.data.milestones.forEach(function (m) { draft.milestones[m.key] = !!p.milestones[m.key]; });
    state.data.editableFields.forEach(function (f) { draft[f.key] = p[f.key] || ''; });
    state.edit = { id: id, draft: draft, saving: false };
    rerenderModal();
  }
  function cancelEdit() {
    if (!confirmDiscard()) return;
    state.edit = null;
    rerenderModal();
  }
  function rerenderModal() {
    var p = state.edit ? state.byId[state.edit.id] : null;
    var id = p ? p.id : +($('#modal [data-pid]') || {}).dataset.pid;
    p = p || state.byId[id];
    if (!p) return;
    var top = $('#modal').scrollTop;
    $('#modal').innerHTML = renderPerson(p);
    $('#modal').scrollTop = state.edit ? 0 : top;
    if (state.edit) updateEditUi();
  }

  /** Returns [{label, from, to}] for every field that differs from the sheet. */
  function diffEdit() {
    if (!state.edit) return [];
    var p = state.byId[state.edit.id], d = state.edit.draft, out = [];
    state.data.milestones.forEach(function (m) {
      if (!!p.milestones[m.key] !== d.milestones[m.key]) out.push({ key: m.key, ms: true, label: m.label });
    });
    if (d.position !== p.position) out.push({ key: 'position', label: 'Posisi' });
    state.data.editableFields.forEach(function (f) {
      if ((d[f.key] || '').trim() !== (p[f.key] || '')) out.push({ key: f.key, label: f.label });
    });
    return out;
  }
  function countChanges() { return diffEdit().length; }
  /** { fieldKey: message } for changed fields that the server would reject. */
  function editErrors() {
    var out = {};
    if (!state.edit) return out;
    var changed = {};
    diffEdit().forEach(function (c) { changed[c.key] = 1; });
    state.data.editableFields.forEach(function (f) {
      if (!changed[f.key]) return;
      var e = fieldError(f, state.edit.draft[f.key]);
      if (e) out[f.key] = e;
    });
    return out;
  }
  function setChoice(key, value) {
    var d = state.edit.draft;
    d[key] = d[key] === value ? '' : value; // tap the active option again to clear it
    $$('#modal [data-set-choice="' + key + '"]').forEach(function (b) { b.classList.toggle('active', b.dataset.value === d[key]); });
    updateEditUi();
  }

  function updateEditUi() {
    var n = countChanges();
    var btn = $('#saveEditBtn');
    if (!btn) return;
    var errors = editErrors();
    var nErr = Object.keys(errors).length;
    btn.disabled = !n || nErr > 0 || state.edit.saving;
    $('#saveEditLabel').textContent = state.edit.saving ? 'Menyimpan…'
      : nErr ? 'Periksa ' + nErr + ' isian'
      : (n ? 'Simpan ' + n + ' perubahan' : 'Belum ada perubahan');
    btn.classList.toggle('loading', state.edit.saving);
    $('#cancelEditBtn').disabled = state.edit.saving;
    var changed = {};
    diffEdit().forEach(function (c) { changed[c.key] = 1; });
    $$('#modal [data-field-wrap]').forEach(function (el) {
      var k = el.dataset.fieldWrap;
      el.classList.toggle('changed', !!changed[k]);
      el.classList.toggle('invalid', !!errors[k]);
      var err = $('.err', el);
      if (err) err.textContent = errors[k] || '';
    });
    $$('#modal [data-toggle-ms]').forEach(function (el) {
      el.classList.toggle('changed', !!changed[el.dataset.toggleMs]);
    });
  }

  function toggleMilestone(el) {
    var key = el.dataset.toggleMs;
    var d = state.edit.draft;
    d.milestones[key] = !d.milestones[key];
    paintToggle(el, d.milestones[key]);
    updateEditUi();
  }
  function paintToggle(el, done) {
    var m = state.data.milestones.filter(function (x) { return x.key === el.dataset.toggleMs; })[0];
    el.classList.toggle('done', done);
    el.setAttribute('aria-pressed', done ? 'true' : 'false');
    el.innerHTML = (done ? ICON.check : '<span class="box"></span>') + esc(m.label);
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }
  function toggleGroup(group) {
    var d = state.edit.draft;
    var keys = state.data.milestones.filter(function (m) { return m.group === group; }).map(function (m) { return m.key; });
    var allDone = keys.every(function (k) { return d.milestones[k]; });
    keys.forEach(function (k) {
      d.milestones[k] = !allDone;
      var el = $('#modal [data-toggle-ms="' + k + '"]');
      if (el) paintToggle(el, !allDone);
    });
    var link = $('#modal [data-toggle-group="' + group + '"]');
    if (link) link.textContent = allDone ? 'Centang semua' : 'Kosongkan';
    updateEditUi();
  }
  function setPosition(pos) {
    state.edit.draft.position = pos;
    $$('#modal [data-set-pos]').forEach(function (b) { b.classList.toggle('active', b.dataset.setPos === pos); });
    updateEditUi();
  }
  function fillNow(key) {
    var v = new Date().toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
    state.edit.draft[key] = v;
    var input = $('#modal [data-field="' + key + '"]');
    if (input) { input.value = v; input.focus(); }
    updateEditUi();
  }

  function saveEdit() {
    var e = state.edit;
    if (!e || e.saving) return;
    var changes = diffEdit();
    if (!changes.length) return;
    var p = state.byId[e.id];
    var payload = { id: p.id, name: p.name, milestones: {} };
    changes.forEach(function (c) {
      if (c.ms) payload.milestones[c.key] = e.draft.milestones[c.key];
      else payload[c.key] = (e.draft[c.key] || '').trim();
    });
    e.saving = true;
    updateEditUi();
    api('updatePerson', payload).then(function (res) {
      state.edit = null;
      onData(res.data, false);
      var fresh = state.byId[p.id];
      if (fresh && $('#modalWrap').classList.contains('open')) {
        rerenderModal();
        var m = $('#modal');
        m.classList.remove('saved-flash');
        void m.offsetWidth;
        m.classList.add('saved-flash');
      }
      var n = res.changes.length;
      toast(n ? 'Tersimpan · ' + n + ' perubahan ✨' : 'Tidak ada yang berubah');
    }, function (err) {
      if (err.isAuth) return;
      e.saving = false;
      updateEditUi();
      var msg = errText(err);
      if (/permission|izin|access|akses/i.test(msg)) msg = 'Kamu tidak punya akses edit ke spreadsheet ini.';
      toast('Gagal menyimpan: ' + msg, true);
    });
  }

  function renderEditBody(p) {
    var d = state.edit.draft;
    var groups = {};
    state.data.milestones.forEach(function (m) { (groups[m.group] = groups[m.group] || []).push(m); });
    var journey = Object.keys(groups).map(function (g) {
      var allDone = groups[g].every(function (m) { return d.milestones[m.key]; });
      return '<div class="j-group edit"><div class="j-label">' + esc(g) + '</div><div class="j-steps">' +
        groups[g].map(function (m) {
          var done = d.milestones[m.key];
          return '<button type="button" class="step toggle' + (done ? ' done' : '') + '" data-toggle-ms="' + m.key + '" aria-pressed="' + done + '">' +
            (done ? ICON.check : '<span class="box"></span>') + esc(m.label) + '</button>';
        }).join('') +
        '<button type="button" class="link-btn" data-toggle-group="' + esc(g) + '">' + (allDone ? 'Kosongkan' : 'Centang semua') + '</button>' +
        '</div></div>';
    }).join('');

    var opts = state.data.positionOptions.slice();
    if (opts.indexOf(d.position) < 0 && d.position && d.position !== 'UNKNOWN') opts.unshift(d.position);
    var seg = opts.map(function (o) {
      return '<button type="button" class="chip' + (d.position === o ? ' active' : '') + '" data-set-pos="' + esc(o) + '">' + esc(POSITION_LABEL[o] || o) + '</button>';
    }).join('');

    var bySection = function (sec) {
      return state.data.editableFields.filter(function (f) { return f.section === sec; })
        .map(function (f) { return renderField(f, p, d); }).join('');
    };

    return '<div class="m-body">' +
      '<div class="m-section"><h4>Perjalanan Bertumbuh <span class="h4-hint">tap untuk centang</span></h4><div class="journey">' + journey + '</div></div>' +
      '<div class="m-section"><h4>Jenjang</h4>' +
      '<div class="field-label">Posisi</div><div class="chips seg">' + seg + '</div>' +
      '<div class="form-grid">' + bySection('jenjang') + '</div></div>' +
      '<div class="m-section"><h4>Data Diri</h4><div class="form-grid">' + bySection('pribadi') + '</div></div>' +
      '</div>' +
      '<div class="m-footer">' +
      '<button type="button" class="btn" id="cancelEditBtn" data-cancel-edit>Batal</button>' +
      '<button type="button" class="btn primary" id="saveEditBtn" data-save-edit disabled>' +
      '<span class="spin"></span>' + ICON.save + '<span id="saveEditLabel">Belum ada perubahan</span></button>' +
      '</div>';
  }

  var PLACEHOLDER = {
    month: 'mis. Juni 2026', tel: '08xx-xxxx-xxxx', email: 'nama@email.com', digits: 'mis. 24000318',
    textarea: '', suggest: '',
  };

  /** One form control for an editable field, chosen by its type. */
  function renderField(f, p, d) {
    var val = d[f.key] == null ? '' : d[f.key];
    var locked = (f.key === 'targetCoach' || f.key === 'notes') && p.targetCoachHoldsNotes;
    var id = 'f-' + f.key;
    var max = f.maxLength || 100;
    var control;
    if (f.type === 'choice') {
      control = '<div class="chips seg tight" role="radiogroup">' + f.options.map(function (o) {
        return '<button type="button" class="chip' + (val === o ? ' active' : '') + '" data-set-choice="' + f.key + '" data-value="' + esc(o) + '">' + esc(o) + '</button>';
      }).join('') + '</div>';
    } else if (f.type === 'textarea') {
      control = '<textarea id="' + id + '" rows="' + (f.key === 'notes' ? 3 : 2) + '" maxlength="' + max + '" data-field="' + f.key + '" placeholder="' + esc(f.placeholder || PLACEHOLDER.textarea) + '"' + (locked ? ' disabled' : '') + '>' + esc(val) + '</textarea>';
    } else if (f.type === 'date' && (!val || parseLooseDate(val))) {
      var dt = val ? parseLooseDate(val) : null;
      control = '<input id="' + id + '" type="date" data-field="' + f.key + '" data-kind="date" value="' + (dt ? toIso(dt) : '') + '"' + (f.future ? '' : ' max="' + toIso(new Date()) + '"') + '>' +
        (val ? '<div class="hint soft">Di sheet: ' + esc(val) + '</div>' : '');
    } else {
      var type = f.type === 'email' ? 'email' : f.type === 'tel' ? 'tel' : 'text';
      var extra = f.type === 'digits' ? ' inputmode="numeric"' : '';
      if (f.type === 'suggest') extra += ' list="dl-' + f.key + '"';
      var hasNow = f.fillNow && !locked;
      control = '<div class="input-wrap"><input id="' + id + '" type="' + type + '" maxlength="' + max + '" data-field="' + f.key + '"' +
        ' value="' + esc(val) + '" placeholder="' + esc(f.placeholder || PLACEHOLDER[f.type] || '') + '" autocomplete="off"' + extra +
        (hasNow ? ' class="has-now"' : '') + (locked ? ' disabled' : '') + '>' +
        (hasNow ? '<button type="button" class="now-btn" data-fill-now="' + f.key + '" title="Isi bulan ini">' + ICON.cal + '</button>' : '') +
        '</div>' + (f.type === 'suggest' ? datalist(f.key) : '');
    }
    return '<div class="field' + (locked ? ' locked' : '') + (f.type === 'textarea' ? ' wide' : '') + '" data-field-wrap="' + f.key + '">' +
      '<label for="' + id + '">' + esc(f.label) + '</label>' + control +
      (locked ? '<div class="hint">Kolom ini masih berisi catatan (header bergeser). Rapikan di sheet dulu.</div>' : '') +
      '<div class="err"></div></div>';
  }

  /** Autocomplete list built from values already used in the database. */
  function datalist(key) {
    var seen = {}, out = [];
    state.people.forEach(function (p) {
      var v = (p[key] || '').trim();
      if (v && !seen[v.toLowerCase()]) { seen[v.toLowerCase()] = 1; out.push(v); }
    });
    out.sort(function (a, b) { return a.localeCompare(b, 'id'); });
    return '<datalist id="dl-' + key + '">' + out.slice(0, 300).map(function (v) {
      return '<option value="' + esc(v) + '">';
    }).join('') + '</datalist>';
  }

  /** Mirrors validateField_ in Code.gs so problems show before saving. */
  function fieldError(f, v) {
    v = (v || '').trim();
    if (!v) return '';
    if (f.type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return 'Format email tidak valid';
    if (f.type === 'tel' && !/^\+?[\d\s\-().]{6,20}$/.test(v)) return 'Isi nomor HP (angka, 6–20 digit)';
    if (f.type === 'digits' && !/^[\d\s\-]+$/.test(v)) return 'Hanya angka';
    return '';
  }

  var MONTHS_EN = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var MONTH_IDX = {
    jan: 0, januari: 0, january: 0, feb: 1, februari: 1, february: 1, mar: 2, maret: 2, march: 2, apr: 3, april: 3,
    mei: 4, may: 4, jun: 5, juni: 5, june: 5, jul: 6, juli: 6, july: 6, agu: 7, agt: 7, agustus: 7, aug: 7, august: 7,
    sep: 8, sept: 8, september: 8, okt: 9, oktober: 9, oct: 9, october: 9, nov: 10, november: 10, des: 11, desember: 11, dec: 11, december: 11,
  };
  /** Same formats as parseDate_ in Code.gs: "19 November 2002", "19/11/2002", "2002-11-19". */
  function parseLooseDate(s) {
    var m = String(s).match(/(\d{1,2})\s+([A-Za-z]+)\.?\s+(\d{4})/);
    if (m && MONTH_IDX[m[2].toLowerCase()] !== undefined) return new Date(+m[3], MONTH_IDX[m[2].toLowerCase()], +m[1]);
    m = String(s).match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
    if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
    m = String(s).match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
    return null;
  }
  function toIso(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  /** "2002-11-19" -> "19 November 2002" (the format already used in the TTL column). */
  function isoToLong(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    return m ? (+m[3]) + ' ' + MONTHS_EN[+m[2] - 1] + ' ' + m[1] : '';
  }

  function renderPerson(p) {
    var coach = state.coaches.filter(function (c) { return c.key === p.coach; })[0];
    var accent = coach ? coach.accent : ACCENTS[0];
    var wa = waLink(p.phone);
    var editing = !!(state.edit && state.edit.id === p.id);
    var actions = [];
    var admin = !!(state.data.user && state.data.user.isAdmin);
    // Coach rows: only TLs and admins edit them (the server enforces the same).
    var lead = seesMany();
    if (!p.isCoach || lead) actions.push('<button type="button" class="btn edit-btn" data-start-edit="' + p.id + '">' + ICON.edit + 'Edit</button>');
    if (window.AOGLdp && (!p.isCoach || lead)) actions.push('<button type="button" class="btn edit-btn" data-ldp-open="' + p.id + '">' + ICON.check + 'Update LDP</button>');
    if (window.AOGRestructure && !p.isCoach) actions.push('<button type="button" class="btn edit-btn" data-rs-move="' + p.id + '">' + ICON.users + 'Pindah CG</button>');
    if (window.AOGRestructure && admin) actions.push('<button type="button" class="btn danger-btn" data-rs-delete="' + p.id + '">' + ICON.close + 'Hapus</button>');
    if (wa) actions.push('<a class="btn primary" href="' + esc(wa) + '" target="_blank" rel="noopener">' + ICON.wa + 'WhatsApp</a>');
    if (p.phone) actions.push('<a class="btn" href="tel:' + esc(p.phone.replace(/[^\d+]/g, '')) + '" target="_top">' + ICON.phone + 'Telepon</a>');
    if (p.email) actions.push('<a class="btn" href="mailto:' + esc(p.email) + '" target="_top">' + ICON.mail + 'Email</a>');
    if (state.data.spreadsheetUrl) {
      actions.push('<a class="btn" href="' + esc(state.data.spreadsheetUrl + '&range=A' + p.id) + '" target="_blank" rel="noopener">' + ICON.sheet + 'Baris ' + p.id + '</a>');
    }

    var elig = [['eligibleCgl', 'Eligible CGL'], ['eligibleCoach', 'Eligible Coach'], ['eligibleTl', 'Eligible TL']]
      .filter(function (e) { return /^yes$/i.test(p[e[0]]); })
      .map(function (e) { return '<span class="badge" style="background:#fef3c7;color:#92400e">★ ' + e[1] + '</span>'; }).join('');

    // Journey
    var groups = {};
    state.data.milestones.forEach(function (m) { (groups[m.group] = groups[m.group] || []).push(m); });
    var k = 0;
    var journey = Object.keys(groups).map(function (g) {
      return '<div class="j-group"><div class="j-label">' + esc(g) + '</div><div class="j-steps">' +
        groups[g].map(function (m) {
          var done = p.milestones[m.key];
          return '<span class="step' + (done ? ' done' : '') + '" style="animation-delay:' + (k++ * 35) + 'ms">' + (done ? ICON.check : '') + esc(m.label) + '</span>';
        }).join('') + '</div></div>';
    }).join('');

    // Info
    var ttl = [p.birthCity, p.birthDate].filter(Boolean).join(', ');
    var info = [
      ['Gender', p.gender], ['Umur', p.age ? p.age + ' tahun' : ''], ['Tempat, tgl lahir', ttl], ['Domisili', p.domicile],
      ['Kerja / Kuliah', p.occupation], ['Kampus / Sekolah', p.school], ['Pelayanan', p.ministry], ['NIJ', p.nij],
      ['No HP', p.phone], ['Email', p.email],
    ].map(function (f) {
      return '<div class="info"><label>' + esc(f[0]) + '</label><div>' + esc(f[1] || '—') + '</div></div>';
    }).join('') + '<div class="info wide"><label>Alamat</label><div>' + esc(p.address || '—') + '</div></div>';

    // Timeline
    var rank = { VIP: 0, SIMPATISAN: 0, MEMBER: 1, SPONSOR: 2, CGL: 3, COACH: 4, 'TEAM LEADER': 5 }[p.position] || 0;
    var tl = LDP_STEPS.map(function (st, i) {
      var date = p[st.date], target = p[st.target];
      return { t: st.label, done: rank >= i + 1 || !!date, sub: [date && 'Tercapai ' + date, !date && target && 'Target ' + target] };
    }).map(function (x) {
      var sub = x.sub.filter(Boolean).join(' · ') || (x.done ? 'Selesai' : 'Belum ada target');
      return '<div class="tl-item' + (x.done ? ' done' : '') + '"><div class="tl-dot"></div><div><div class="tl-title">' + x.t + '</div><div class="tl-sub">' + esc(sub) + '</div></div></div>';
    }).join('');

    var actionsHtml = editing
      ? '<div class="edit-banner">' + ICON.edit + 'Mode edit — perubahan langsung tersimpan ke sheet baris ' + p.id + '</div>'
      : '<div class="m-actions">' + actions.join('') + '</div>';
    var body = editing ? renderEditBody(p) : '<div class="m-body">' +
      '<div class="m-section"><h4>Perjalanan Bertumbuh</h4><div class="journey">' + journey + '</div></div>' +
      (p.notes ? '<div class="m-section"><h4>Catatan</h4><div class="note">' + esc(p.notes) + '</div></div>' : '') +
      '<div class="m-section"><h4>Jenjang</h4><div class="timeline">' + tl + '</div></div>' +
      (window.AOGMeetings ? window.AOGMeetings.personSection(p) : '') +
      '<div class="m-section"><h4>Data Diri</h4><div class="info-grid">' + info + '</div></div>' +
      '</div>';

    return '<div class="m-head' + (editing ? ' editing' : '') + '" data-pid="' + p.id + '"><div class="m-head-row">' +
      '<div class="avatar lg" style="--accent:' + accent + '">' + esc(initials(p.name)) + '</div>' +
      '<div style="flex:1;min-width:0"><div class="m-name">' + esc(p.name) + '</div>' +
      '<div class="m-sub">' + esc(whoLine(p, true)) + '</div>' +
      '<div class="m-badges">' + posBadge(p) + statusBadge(p) + (p.cgStatus ? '<span class="badge line">' + esc(p.cgStatus) + '</span>' : '') +
      '<span class="badge line">Growth ' + msPct(p) + '%</span>' +
      (p.attendancePct != null ? '<span class="badge line">' + esc(attendanceText(p)) + '</span>' : '') + elig + '</div></div>' +
      '<button class="close-btn dark" data-close-modal aria-label="Tutup">' + ICON.close + '</button></div>' +
      actionsHtml + '</div>' + body;
  }

  // ───────────── Search ─────────────
  function runSearch(q) {
    q = q.trim().toLowerCase();
    var box = $('#searchResults');
    if (!q || !state.data) { closeSearch(); return; }
    var res = state.people.filter(function (p) {
      return [p.name, p.cg, p.cgl, p.school, p.coach, p.ministry, p.domicile, p.position].join(' ').toLowerCase().indexOf(q) >= 0;
    }).slice(0, 30);
    state.search = { results: res, active: res.length ? 0 : -1 };
    box.innerHTML = res.length ? res.map(function (p, i) {
      return '<button class="sr-item' + (i === 0 ? ' active' : '') + '" data-person="' + p.id + '" role="option">' +
        '<div class="avatar sm soft">' + esc(initials(p.name)) + '</div>' +
        '<div class="pr-main"><div class="pr-name">' + esc(p.name) + '</div><div class="pr-sub">' +
        esc(whoLine(p, false)) + '</div></div>' + posBadge(p) + '</button>';
    }).join('') : '<div class="sr-empty">Tidak ditemukan untuk "' + esc(q) + '"</div>';
    box.classList.add('open');
  }
  function closeSearch() { $('#searchResults').classList.remove('open'); }
  function moveSearch(dir) {
    var items = $$('.sr-item');
    if (!items.length) return;
    state.search.active = (state.search.active + dir + items.length) % items.length;
    items.forEach(function (el, i) { el.classList.toggle('active', i === state.search.active); });
    items[state.search.active].scrollIntoView({ block: 'nearest' });
  }

  /** True when the signed-in user may work with this coach's people (admin: all; TL: their coaches). */
  function canCoach(coach) {
    var u = (state.data && state.data.user) || {};
    var k = String(coach || '').toLowerCase();
    if (u.isAdmin) return true;
    if (u.isTl) return (u.coaches || []).some(function (c) { return String(c).toLowerCase() === k; });
    return !!k && String(u.coach || '').toLowerCase() === k;
  }
  /** Admin or TL: sees more than one coach, so lists show coach names and coach filters. */
  function seesMany() { var u = (state.data && state.data.user) || {}; return !!(u.isAdmin || u.isTl); }

  // ───────────── Login ─────────────
  function renderUser(user) {
    user = user || {};
    var label = user.isAdmin ? user.username + ' · Admin' : user.isTl ? 'TL ' + (user.coach || user.username) : 'Coach ' + (user.coach || user.username);
    $('#userName').textContent = label;
    $('#userAvatar').textContent = initials(user.coach || user.username);
    $('#userChip').title = 'Masuk sebagai ' + user.username;
  }

  function showLogin(message) {
    var screen = $('#authScreen');
    document.body.classList.add('signed-out');
    screen.classList.remove('checking', 'leaving');
    $('#loginError').textContent = message || '';
    $('#loginPass').value = '';
    setTimeout(function () { ($('#loginUser').value ? $('#loginPass') : $('#loginUser')).focus(); }, 50);
  }

  function enterApp() {
    if (!document.body.classList.contains('signed-out')) return;
    var screen = $('#authScreen');
    screen.classList.add('leaving');
    setTimeout(function () {
      document.body.classList.remove('signed-out');
      screen.classList.remove('leaving');
    }, 350);
  }

  /** Drops the session and everything loaded with it, then shows the login form. */
  function signOut(message) {
    saveToken('');
    state.edit = null;
    state.data = null; state.people = []; state.byId = {}; state.coaches = [];
    $('#modalWrap').classList.remove('open');
    closeDrawer();
    closeSearch();
    $('#searchInput').value = '';
    $('#coachGrid').innerHTML = '';
    if (window.AOGMeetings) window.AOGMeetings.reset();
    if (window.AOGLdp) window.AOGLdp.reset();
    if (window.AOGLocations) window.AOGLocations.reset();
    if (window.AOGCg) window.AOGCg.reset();
    if (window.AOGRestructure) window.AOGRestructure.reset();
    if (window.AOGMultiply) window.AOGMultiply.reset();
    if (window.AOGVisits) window.AOGVisits.reset();
    showLogin(message);
  }

  function setLoginBusy(busy) {
    $('#loginBtn').disabled = busy;
    $('#loginBtn').classList.toggle('loading', busy);
    $('#loginLabel').textContent = busy ? 'Memeriksa…' : 'Masuk';
  }

  $('#loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var user = $('#loginUser').value.trim();
    var pass = $('#loginPass').value;
    if (!user || !pass) { $('#loginError').textContent = 'Isi username dan password.'; shake(); return; }
    $('#loginError').textContent = '';
    setLoginBusy(true);
    callServer('login', user, pass).then(function (res) {
      setLoginBusy(false);
      saveToken(res.token);
      $('#loginPass').value = '';
      load(false);
    }, function (err) {
      setLoginBusy(false);
      $('#loginError').textContent = errText(err);
      $('#loginPass').select();
      shake();
    });
  });

  function shake() {
    var card = $('#authCard');
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');
  }

  $('#togglePass').addEventListener('click', function () {
    var input = $('#loginPass');
    input.type = input.type === 'password' ? 'text' : 'password';
    input.focus();
  });

  $('#logoutBtn').addEventListener('click', function () {
    if (state.edit && !confirmDiscard()) return;
    var t = state.token;
    if (t) callServer('logout', t).catch(function () { /* already gone */ });
    signOut('Kamu sudah keluar.');
  });

  // ───────────── Events ─────────────
  document.addEventListener('click', function (e) {
    var t = e.target;
    var el;
    if ((el = t.closest('[data-start-edit]'))) return startEdit(+el.dataset.startEdit);
    if (state.edit && !state.edit.saving) {
      if ((el = t.closest('[data-toggle-ms]'))) return toggleMilestone(el);
      if ((el = t.closest('[data-toggle-group]'))) return toggleGroup(el.dataset.toggleGroup);
      if ((el = t.closest('[data-set-pos]'))) return setPosition(el.dataset.setPos);
      if ((el = t.closest('[data-set-choice]'))) return setChoice(el.dataset.setChoice, el.dataset.value);
      if ((el = t.closest('[data-fill-now]'))) return fillNow(el.dataset.fillNow);
      if ((el = t.closest('[data-cancel-edit]'))) return cancelEdit();
      if ((el = t.closest('[data-save-edit]'))) return saveEdit();
    }
    if ((el = t.closest('[data-close-modal]'))) return closeModal();
    if ((el = t.closest('[data-close-drawer]')) || t.id === 'drawerScrim') return closeDrawer();
    if ((el = t.closest('[data-person]'))) return openPerson(+el.dataset.person);
    if ((el = t.closest('[data-coach]'))) return openCoach(el.dataset.coach);
    if ((el = t.closest('[data-tab]'))) return setTab(el.dataset.tab);
    if ((el = t.closest('[data-pos]'))) { state.drawer.pos = el.dataset.pos; return renderTab(); }
    if ((el = t.closest('[data-status]'))) { state.drawer.status = el.dataset.status; return renderTab(); }
    if ((el = t.closest('[data-ms]'))) return el.parentNode.classList.toggle('open');
    if (!t.closest('#searchWrap')) closeSearch();
  });

  var searchInput = $('#searchInput');
  searchInput.addEventListener('input', function () { runSearch(searchInput.value); });
  searchInput.addEventListener('focus', function () { if (searchInput.value) runSearch(searchInput.value); });
  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); moveSearch(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveSearch(-1); }
    else if (e.key === 'Enter') {
      var p = state.search.results[state.search.active];
      if (p) openPerson(p.id);
    } else if (e.key === 'Escape') { searchInput.blur(); closeSearch(); }
  });

  $('#modal').addEventListener('input', function (e) {
    var f = e.target.dataset && e.target.dataset.field;
    if (!f || !state.edit) return;
    state.edit.draft[f] = e.target.dataset.kind === 'date' ? isoToLong(e.target.value) : e.target.value;
    updateEditUi();
  });
  $('#modal').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.dataset.field) { e.preventDefault(); saveEdit(); }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (state.edit && $('#modalWrap').classList.contains('open')) { if (!state.edit.saving) cancelEdit(); }
      else if ($('#modalWrap').classList.contains('open')) closeModal();
      else if ($('#drawer').classList.contains('open')) closeDrawer();
    } else if (e.key === '/' && !document.body.classList.contains('signed-out') &&
      !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) {
      e.preventDefault();
      searchInput.focus();
    }
  });

  window.addEventListener('resize', moveTabIndicator);
  $('#refreshBtn').addEventListener('click', function () { load(true); });

  /** Shared with MeetingsUi.html. */
  window.AOG = {
    $: $, $$: $$, esc: esc, initials: initials, api: api, state: state, toast: toast, ICON: ICON,
    posInfo: posInfo, errText: errText, updateLock: updateLock, openPerson: openPerson, posBadge: posBadge,
    openCoach: openCoach, closeDrawer: closeDrawer, personRow: personRow, msPct: msPct, cgInfo: cgInfo,
    POSITIONS: POSITIONS, isActive: isActive, canCoach: canCoach, seesMany: seesMany,
    parseLooseDate: parseLooseDate, toIso: toIso, LDP_STEPS: LDP_STEPS,
    /** Show fresh dashboard data returned by another save (without reloading meetings / LDP). */
    applyData: function (data) { onData(data, false, true); },
    /** Re-render the open person modal (e.g. after a meeting was saved). */
    refreshPerson: function () {
      var head = $('#modal [data-pid]');
      if (head && $('#modalWrap').classList.contains('open') && !state.edit) {
        var p = state.byId[+head.dataset.pid];
        var top = $('#modal').scrollTop;
        if (p) { $('#modal').innerHTML = renderPerson(p); $('#modal').scrollTop = top; }
      }
    },
  };

  saveToken(readToken());
  if (state.token) load(false); else showLogin('');
})();
</script>
