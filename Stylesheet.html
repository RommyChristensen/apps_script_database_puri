  * { box-sizing: border-box; }
  [hidden] { display: none !important; } /* the hidden attribute always wins over component display rules */
  html, body { margin: 0; }
  body {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body.locked { overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: var(--blue-600); text-decoration: none; }
  h1, h2, h3, h4 { margin: 0; letter-spacing: -.02em; }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }
  .i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  /* Background blobs */
  .bg-blobs { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .bg-blobs span { position: absolute; border-radius: 50%; filter: blur(70px); opacity: var(--blob-opacity); animation: float 18s ease-in-out infinite; }
  .bg-blobs span:nth-child(1) { width: 480px; height: 480px; background: var(--blue-200); top: -160px; left: -120px; }
  .bg-blobs span:nth-child(2) { width: 420px; height: 420px; background: var(--sky-200); top: 30%; right: -160px; animation-delay: -6s; }
  .bg-blobs span:nth-child(3) { width: 360px; height: 360px; background: var(--blue-100); bottom: -140px; left: 30%; animation-delay: -12s; }
  @keyframes float { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(30px,-25px) scale(1.06); } }

  /* Topbar */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 16px;
    padding: 14px clamp(16px, 4vw, 40px);
    background: var(--glass);
    backdrop-filter: saturate(1.6) blur(14px);
    -webkit-backdrop-filter: saturate(1.6) blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand-mark {
    width: 40px; height: 40px; border-radius: 13px; background: var(--grad);
    display: grid; place-items: center; box-shadow: 0 8px 20px -8px rgba(37,99,235,.7);
    animation: pop .7s var(--spring) both;
  }
  .brand-mark svg { width: 20px; height: 20px; fill: #fff; }
  .brand-title { font-weight: 800; font-size: 16px; white-space: nowrap; }
  .brand-sub { font-size: 12px; color: var(--muted); white-space: nowrap; }

  .search { position: relative; flex: 1; max-width: 520px; margin-left: auto; display: flex; align-items: center; }
  .search > .i { position: absolute; left: 14px; color: var(--muted); pointer-events: none; }
  .search input {
    width: 100%; height: 44px; padding: 0 44px 0 42px; border-radius: 14px;
    border: 1.5px solid var(--line); background: var(--card); font: inherit; font-size: 14px; color: var(--ink);
    transition: border-color .2s, box-shadow .2s;
  }
  .search input:focus { outline: none; border-color: var(--sky-400); box-shadow: 0 0 0 4px rgba(56,189,248,.18); }
  .search input::-webkit-search-cancel-button { display: none; }
  .search kbd {
    position: absolute; right: 12px; font: 600 11px/1 inherit; color: var(--muted);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 7px; background: var(--sky-50);
  }
  .search-results {
    position: absolute; top: calc(100% + 8px); left: 0; right: 0; z-index: 40;
    background: var(--card); border-radius: 16px; box-shadow: var(--shadow-lg); border: 1px solid var(--line);
    max-height: 60vh; overflow: auto; padding: 6px;
    opacity: 0; transform: translateY(-6px) scale(.98); pointer-events: none;
    transition: opacity .18s, transform .25s var(--ease-out);
  }
  .search-results.open { opacity: 1; transform: none; pointer-events: auto; }
  .sr-item { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 9px 10px; border: 0; border-radius: 12px; background: none; }
  .sr-item:hover, .sr-item.active { background: var(--sky-50); }
  .sr-empty { padding: 18px; text-align: center; color: var(--muted); font-size: 13px; }

  .top-actions { display: flex; gap: 8px; }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card);
    display: grid; place-items: center; color: var(--blue-600);
    transition: transform .2s var(--spring), background .2s, border-color .2s;
  }
  .icon-btn:hover { background: var(--sky-50); border-color: var(--sky-200); transform: translateY(-1px); }
  .icon-btn:active { transform: scale(.94); }
  .icon-btn.spinning .i { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  main { max-width: 1240px; margin: 0 auto; padding: 24px clamp(16px, 4vw, 40px) 48px; }

  /* Hero */
  .hero {
    position: relative; overflow: hidden;
    display: grid; grid-template-columns: 1.1fr 1fr; gap: 28px; align-items: center;
    padding: clamp(22px, 4vw, 36px); border-radius: 28px;
    background: linear-gradient(135deg, var(--blue-700) 0%, var(--blue-600) 40%, var(--sky-400) 100%);
    color: #fff; box-shadow: var(--shadow-lg);
  }
  .hero::before, .hero::after {
    content: ''; position: absolute; border-radius: 50%; background: rgba(255,255,255,.12);
  }
  .hero::before { width: 320px; height: 320px; right: -80px; top: -120px; }
  .hero::after { width: 180px; height: 180px; left: 40%; bottom: -100px; background: rgba(186,230,253,.25); }
  .hero > * { position: relative; z-index: 1; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    background: rgba(255,255,255,.18); padding: 6px 12px; border-radius: 999px; backdrop-filter: blur(6px);
  }
  .eyebrow::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--emerald-200); box-shadow: 0 0 0 4px rgba(167,243,208,.3); animation: pulse 2s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(167,243,208,0); } }
  .hero h1 { font-size: clamp(26px, 3.6vw, 40px); line-height: 1.1; font-weight: 800; margin: 14px 0 10px; }
  .hero h1 .grad { background: linear-gradient(90deg, #e0f2fe, #ffffff); -webkit-background-clip: text; background-clip: text; color: transparent; text-decoration: underline wavy rgba(224,242,254,.6) 2px; text-underline-offset: 6px; }
  .hero-sub { margin: 0; opacity: .88; font-size: 14.5px; max-width: 460px; line-height: 1.55; }
  .hero-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .stat {
    background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.28); border-radius: 18px; padding: 16px 18px;
    backdrop-filter: blur(10px); min-height: 92px;
    animation: rise .6s var(--ease-out) both;
  }
  .stat:nth-child(2) { animation-delay: .06s; } .stat:nth-child(3) { animation-delay: .12s; } .stat:nth-child(4) { animation-delay: .18s; }
  .stat-num { font-size: 30px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
  .stat-label { font-size: 12.5px; opacity: .9; margin-top: 8px; font-weight: 600; }
  .stat-hint { font-size: 11.5px; opacity: .75; margin-top: 2px; }

  .warnings:empty { display: none; }
  .warnings { margin-top: 16px; display: grid; gap: 8px; }
  .warn { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: var(--amber-50); color: var(--amber-800); border: 1px solid var(--amber-200); font-size: 13px; }

  /* Sections */
  .section { margin-top: 32px; }
  .section-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .section-head h2 { font-size: 20px; font-weight: 800; }
  .pill-soft { font-size: 12px; font-weight: 700; color: var(--blue-600); background: var(--sky-100); padding: 4px 10px; border-radius: 999px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1.15fr; gap: 18px; align-items: start; }

  /* Coach cards */
  .coach-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 720px) { .coach-grid { grid-template-columns: 1fr; } }
  .coach-card {
    position: relative; text-align: left; border: 1px solid var(--line); background: var(--card);
    border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow-sm); overflow: hidden;
    transition: transform .35s var(--spring), box-shadow .3s, border-color .3s;
    animation: rise .6s var(--ease-out) both; min-height: 200px;
  }
  .coach-card::before {
    content: ''; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--accent, var(--grad));
  }
  .coach-card:hover { transform: translateY(-4px); box-shadow: var(--shadow); border-color: var(--sky-200); }
  .coach-card:active { transform: translateY(-1px) scale(.99); }
  .coach-card:focus-visible { outline: 3px solid var(--sky-300); outline-offset: 2px; }
  .cc-top { display: flex; align-items: center; gap: 12px; }
  .avatar {
    width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; flex-shrink: 0;
    font-weight: 800; color: #fff; font-size: 15px; background: var(--accent, var(--grad));
    box-shadow: 0 6px 16px -8px rgba(37,99,235,.6);
  }
  .avatar.lg { width: 64px; height: 64px; border-radius: 20px; font-size: 22px; }
  .avatar.sm { width: 34px; height: 34px; border-radius: 11px; font-size: 12px; box-shadow: none; }
  .avatar.soft { background: var(--sky-100); color: var(--blue-700); }
  .cc-name { font-weight: 800; font-size: 17px; }
  .cc-full { font-size: 12.5px; color: var(--muted); }
  .cc-arrow { margin-left: auto; width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--sky-50); color: var(--blue-600); transition: transform .3s var(--spring), background .2s; }
  .coach-card:hover .cc-arrow { transform: translateX(3px); background: var(--sky-100); }
  .cc-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0 14px; }
  .cc-stat { background: var(--sky-50); border-radius: 12px; padding: 10px 8px; min-width: 0; }
  .cc-stat b { display: block; font-size: 22px; font-weight: 800; color: var(--navy); }
  .cc-stat span { font-size: 11.5px; color: var(--muted); font-weight: 600; }
  .stack { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--sky-50); gap: 2px; }
  .stack > i { display: block; height: 100%; border-radius: 999px; transform-origin: left; animation: grow .9s var(--ease-out) both; }
  @keyframes grow { from { transform: scaleX(0); } }
  .cc-foot { display: flex; justify-content: space-between; margin-top: 10px; font-size: 12px; color: var(--muted); font-weight: 600; }

  /* Panels */
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow-sm); min-width: 0; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .panel-head h3 { font-size: 16px; font-weight: 800; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11.5px; color: var(--muted); font-weight: 600; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 4px; display: inline-block; }
  .composition { display: grid; gap: 14px; }
  .comp-row { display: grid; grid-template-columns: 90px 1fr 34px; gap: 12px; align-items: center; font-size: 13px; }
  .comp-row b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .comp-row .stack { height: 14px; }
  .comp-row .num { text-align: right; color: var(--muted); font-weight: 700; }

  .table-scroll { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
  table.heat { width: 100%; border-collapse: separate; border-spacing: 4px; font-size: 12.5px; }
  .heat th { font-weight: 700; color: var(--muted); text-align: center; padding: 4px 6px; white-space: nowrap; font-size: 11.5px; }
  .heat th:first-child, .heat td:first-child { text-align: left; }
  .heat td:first-child { font-weight: 600; white-space: nowrap; padding-right: 8px; color: var(--ink-2); }
  .heat td.cell { text-align: center; border-radius: 9px; padding: 7px 4px; font-weight: 700; min-width: 46px; transition: transform .2s var(--spring); }

  .foot { margin-top: 36px; text-align: center; color: var(--muted); font-size: 12px; }

  /* Skeletons */
  .skeleton { position: relative; overflow: hidden; background: var(--surface-2) !important; border-color: transparent !important; }
  .hero .skeleton { background: rgba(255,255,255,.14) !important; }
  .skeleton::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
    transform: translateX(-100%); animation: shimmer 1.3s infinite;
  }
  @keyframes shimmer { to { transform: translateX(100%); } }

  /* Reveal animations */
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  @keyframes pop { from { opacity: 0; transform: scale(.6) rotate(-12deg); } }
  .reveal { animation: rise .7s var(--ease-out) both; }

  /* Badges & chips */
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 800; letter-spacing: .03em; padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
  .badge.status-on { background: var(--green-100); color: var(--emerald-700); }
  .badge.status-off { background: var(--slate-100); color: var(--slate-500); }
  .badge.line { background: var(--card); border: 1px solid var(--line); color: var(--ink-2); font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 13px; font-size: 12.5px; font-weight: 700; color: var(--ink-2);
    transition: all .2s var(--ease-out);
  }
  .chip:hover { border-color: var(--sky-300); color: var(--blue-600); }
  .chip.active { background: var(--blue-600); border-color: var(--blue-600); color: #fff; box-shadow: 0 6px 14px -6px rgba(37,99,235,.7); }
  .chip .count { opacity: .7; margin-left: 4px; }

  /* Drawer */
  .scrim { position: fixed; inset: 0; background: rgba(11,42,111,.28); backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity .35s; z-index: 50; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); z-index: 51;
    background: var(--bg); box-shadow: -20px 0 60px -20px rgba(11,42,111,.35);
    transform: translateX(105%); transition: transform .5s var(--ease-out);
    display: flex; flex-direction: column; border-radius: 28px 0 0 28px; overflow: hidden;
  }
  .drawer.open { transform: none; }
  .drawer-inner { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
  .drawer-hero { position: relative; padding: 22px 22px 70px; background: var(--accent, var(--grad)); color: #fff; overflow: hidden; }
  .drawer-hero::after { content: ''; position: absolute; width: 240px; height: 240px; border-radius: 50%; background: rgba(255,255,255,.13); right: -70px; top: -90px; }
  .drawer-hero .avatar { background: rgba(255,255,255,.22); box-shadow: none; border: 1px solid rgba(255,255,255,.35); }
  .dh-row { display: flex; align-items: center; gap: 14px; position: relative; z-index: 1; }
  .dh-name { font-size: 24px; font-weight: 800; }
  .dh-sub { opacity: .85; font-size: 13px; }
  .close-btn { margin-left: auto; width: 40px; height: 40px; border-radius: 13px; border: 0; background: rgba(255,255,255,.2); color: #fff; display: grid; place-items: center; transition: transform .25s var(--spring), background .2s; align-self: flex-start; }
  .close-btn:hover { background: rgba(255,255,255,.32); transform: rotate(90deg); }
  .close-btn.dark { background: var(--sky-50); color: var(--blue-700); }
  .close-btn.dark:hover { background: var(--sky-100); }
  .drawer-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: -50px 18px 0; position: relative; z-index: 2; }
  .drawer-stats .cc-stat { background: var(--card); box-shadow: var(--shadow-sm); border: 1px solid var(--line); text-align: center; animation: rise .5s var(--ease-out) both; }
  .drawer-stats .cc-stat:nth-child(2) { animation-delay: .05s; } .drawer-stats .cc-stat:nth-child(3) { animation-delay: .1s; } .drawer-stats .cc-stat:nth-child(4) { animation-delay: .15s; }
  .tabs { position: sticky; top: 0; z-index: 3; display: flex; gap: 4px; margin: 18px 18px 0; padding: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-sm); }
  .tab { position: relative; z-index: 1; flex: 1; border: 0; background: none; padding: 10px; border-radius: 10px; font-weight: 700; font-size: 13px; color: var(--muted); transition: color .25s; }
  .tab.active { color: #fff; }
  .tab-ind { position: absolute; z-index: 0; top: 4px; bottom: 4px; left: 4px; border-radius: 10px; background: var(--grad); transition: transform .4s var(--spring), width .4s var(--spring); box-shadow: 0 6px 14px -6px rgba(37,99,235,.7); }
  .tab-panel { padding: 16px 18px 28px; animation: fadeSlide .4s var(--ease-out) both; }
  @keyframes fadeSlide { from { opacity: 0; transform: translateX(14px); } }

  .cg-card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow-sm); animation: rise .5s var(--ease-out) both; }
  .cg-top { display: flex; align-items: flex-start; gap: 12px; }

  .cg-title { font-weight: 800; font-size: 15px; }
  .cg-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); margin-top: 4px; }

  .mini-person { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 999px; border: 1px solid var(--line); background: var(--sky-50); font-size: 12px; font-weight: 600; transition: transform .2s var(--spring), border-color .2s; }
  .mini-person:hover { transform: translateY(-2px); border-color: var(--sky-300); }

  .mini-person.off { opacity: .55; }

  .person-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 11px 12px; border: 1px solid var(--line); background: var(--card); border-radius: 16px; margin-bottom: 8px; transition: transform .25s var(--spring), box-shadow .2s, border-color .2s; animation: rise .45s var(--ease-out) both; }
  .person-row:hover { transform: translateX(3px); border-color: var(--sky-200); box-shadow: var(--shadow-sm); }
  .pr-main { flex: 1; min-width: 0; }
  .pr-name { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pr-sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ring { --p: 0; width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; font-size: 10px; font-weight: 800; color: var(--blue-700);
    background: radial-gradient(closest-side, var(--card) 76%, transparent 78% 100%), conic-gradient(var(--sky-400) calc(var(--p) * 1%), var(--sky-100) 0); }
  .filter-bar { display: grid; gap: 10px; margin-bottom: 14px; }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; font-size: 13px; }

  .ms-row { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 8px; overflow: hidden; animation: rise .45s var(--ease-out) both; }
  .ms-head { display: grid; grid-template-columns: 110px 1fr 60px; gap: 12px; align-items: center; width: 100%; padding: 12px 14px; border: 0; background: none; text-align: left; font-size: 13px; }
  .ms-head b { font-weight: 700; }
  .bar { height: 10px; border-radius: 999px; background: var(--sky-50); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 999px; background: var(--grad); transform-origin: left; animation: grow 1s var(--ease-out) both; }
  .ms-pct { text-align: right; font-weight: 800; color: var(--blue-700); }
  .ms-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s var(--ease-out); }
  .ms-row.open .ms-body { grid-template-rows: 1fr; }
  .ms-body > div { overflow: hidden; }
  .ms-body .cg-members { margin: 0; padding: 0 14px 14px; }
  .ms-group-label { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--blue-600); margin: 16px 2px 8px; }

  /* Modal */
  .modal-wrap { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; pointer-events: none; }
  .modal-scrim { position: absolute; inset: 0; background: rgba(11,42,111,.35); backdrop-filter: blur(4px); opacity: 0; transition: opacity .3s; }
  .modal {
    position: relative; width: min(620px, 100%); max-height: min(88vh, 900px); overflow-y: auto; overscroll-behavior: contain;
    background: var(--card); border-radius: 26px; box-shadow: var(--shadow-lg);
    opacity: 0; transform: translateY(24px) scale(.94); transition: opacity .25s, transform .45s var(--spring);
  }
  .modal-wrap.open { pointer-events: auto; }
  .modal-wrap.open .modal-scrim { opacity: 1; }
  .modal-wrap.open .modal { opacity: 1; transform: none; }
  .m-head { position: relative; padding: 24px 24px 18px; background: linear-gradient(180deg, var(--sky-50), var(--card)); border-bottom: 1px solid var(--line); }
  .m-head-row { display: flex; gap: 14px; align-items: flex-start; }
  .m-name { font-size: 22px; font-weight: 800; line-height: 1.2; }
  .m-sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .m-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .m-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 12px; font-weight: 700; font-size: 13px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); transition: transform .2s var(--spring), box-shadow .2s, background .2s; }
  .btn:hover { transform: translateY(-1px); background: var(--sky-50); }
  .btn.primary { background: var(--grad); color: #fff; border-color: transparent; box-shadow: 0 8px 18px -8px rgba(37,99,235,.8); }
  .btn.primary:hover { box-shadow: 0 12px 22px -8px rgba(37,99,235,.9); }
  .m-body { padding: 18px 24px 26px; display: grid; gap: 20px; }
  .m-section h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--blue-600); margin-bottom: 10px; font-weight: 800; }
  .journey { display: grid; gap: 10px; }
  .j-group { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; }
  .j-label { font-size: 11.5px; font-weight: 800; color: var(--muted); }
  .j-steps { display: flex; flex-wrap: wrap; gap: 6px; }
  .step { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 10px; background: var(--slate-50); color: var(--slate-400); border: 1px dashed var(--slate-300); animation: pop .45s var(--spring) both; }
  .step.done { background: var(--sky-100); color: var(--blue-700); border: 1px solid var(--sky-200); }
  .step .i { width: 13px; height: 13px; stroke-width: 3; }
  .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .info { background: var(--sky-50); border-radius: 12px; padding: 10px 12px; min-width: 0; }
  .info.wide { grid-column: 1 / -1; }
  .info label { display: block; font-size: 11px; color: var(--muted); font-weight: 700; margin-bottom: 3px; }
  .info div { font-size: 13.5px; font-weight: 600; overflow-wrap: anywhere; }
  .timeline { display: grid; gap: 0; }
  .tl-item { display: grid; grid-template-columns: 18px 1fr; gap: 12px; position: relative; padding-bottom: 14px; }
  .tl-item:not(:last-child)::before { content: ''; position: absolute; left: 8px; top: 18px; bottom: 0; width: 2px; background: var(--sky-100); }
  .tl-dot { width: 18px; height: 18px; border-radius: 50%; background: var(--sky-100); border: 3px solid var(--card); box-shadow: 0 0 0 2px var(--sky-200); margin-top: 1px; }
  .tl-item.done .tl-dot { background: var(--blue-600); box-shadow: 0 0 0 2px var(--blue-600); }
  .tl-title { font-weight: 700; font-size: 13.5px; }
  .tl-sub { font-size: 12px; color: var(--muted); }
  .note { background: linear-gradient(135deg, var(--blue-50), var(--sky-50)); border: 1px solid var(--sky-200); border-radius: 14px; padding: 12px 14px; font-size: 13.5px; line-height: 1.55; color: var(--ink-2); }

  .toast { position: fixed; left: 50%; bottom: 24px; z-index: 80; transform: translate(-50%, 30px); opacity: 0; background: var(--toast); color: #fff; padding: 11px 18px; border-radius: 14px; font-size: 13px; font-weight: 600; box-shadow: var(--shadow-lg); transition: all .4s var(--spring); pointer-events: none; }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }
  .toast.error { background: var(--red-700); max-width: calc(100vw - 32px); }

  /* Edit mode */
  .edit-btn { color: var(--blue-700); border-color: var(--sky-200); background: var(--sky-50); }
  .edit-btn:hover { background: var(--sky-100); }
  .m-head.editing { background: linear-gradient(180deg, var(--sky-100), var(--card)); }
  .edit-banner {
    display: flex; align-items: center; gap: 8px; margin-top: 14px; padding: 10px 12px; border-radius: 12px;
    background: var(--card); border: 1.5px dashed var(--sky-300); color: var(--blue-700); font-size: 12.5px; font-weight: 700;
    animation: rise .35s var(--ease-out) both;
  }
  .h4-hint { text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--muted); font-size: 11.5px; margin-left: 6px; }
  .step.toggle { cursor: pointer; font: inherit; font-size: 12.5px; font-weight: 700; padding: 8px 12px; border-style: solid; border-color: var(--slate-250); background: var(--card); color: var(--ink-2); transition: background .2s, border-color .2s, color .2s, box-shadow .2s; }
  .step.toggle:hover { border-color: var(--sky-300); }

  .step.toggle.done { background: var(--blue-600); border-color: var(--blue-600); color: #fff; box-shadow: 0 6px 14px -8px rgba(37,99,235,.9); }

  .j-group.edit { align-items: start; }

  .link-btn { border: 0; background: none; color: var(--blue-600); font-size: 12px; font-weight: 700; padding: 8px 4px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--sky-300); }
  .field-label, .field label { display: block; font-size: 11.5px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
  .seg { margin-bottom: 16px; }
  .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .input-wrap { position: relative; display: flex; }
  .field input {
    width: 100%; height: 42px; padding: 0 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card);
    font: inherit; font-size: 13.5px; font-weight: 600; color: var(--ink); transition: border-color .2s, box-shadow .2s, background .2s;
  }
  .field input:focus { outline: none; border-color: var(--sky-400); box-shadow: 0 0 0 4px rgba(56,189,248,.18); }

  .field.changed input { border-color: var(--sky-400); background: var(--sky-50); }
  .field.changed label::after { content: ' • diubah'; color: var(--sky-500); }

  .now-btn { position: absolute; right: 5px; top: 5px; width: 32px; height: 32px; border-radius: 9px; border: 0; background: var(--sky-50); color: var(--blue-600); display: grid; place-items: center; transition: background .2s, transform .2s var(--spring); }
  .now-btn:hover { background: var(--sky-100); transform: scale(1.06); }
  .now-btn .i { width: 16px; height: 16px; }
  .field .hint { font-size: 11.5px; color: var(--amber-700); margin-top: 5px; }
  .field .hint.soft { color: var(--muted); }
  .field.wide { grid-column: 1 / -1; }
  .seg.tight { margin-bottom: 0; }
  .field textarea {
    width: 100%; min-height: 64px; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); resize: vertical;
    font: inherit; font-size: 13.5px; font-weight: 600; line-height: 1.5; color: var(--ink); transition: border-color .2s, box-shadow .2s, background .2s;
  }

  .field .err { font-size: 11.5px; font-weight: 700; color: var(--red-600); margin-top: 5px; }

    padding: 14px 24px calc(14px + env(safe-area-inset-bottom)); background: var(--glass-strong); backdrop-filter: blur(8px);
    border-top: 1px solid var(--line); animation: rise .35s var(--ease-out) both;
  }

  .btn .spin { display: none; width: 15px; height: 15px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; animation: spin .7s linear infinite; }
  .btn.loading .spin { display: inline-block; }
  .btn.loading .i { display: none; }
  .modal.saved-flash { animation: savedFlash .9s var(--ease-out); }
  @keyframes savedFlash { 0% { box-shadow: 0 0 0 0 rgba(56,189,248,.7), var(--shadow-lg); } 100% { box-shadow: 0 0 0 18px rgba(56,189,248,0), var(--shadow-lg); } }

    .form-grid { grid-template-columns: 1fr; }

  .error-card { background: var(--card); border: 1px solid var(--red-200); border-radius: var(--radius); padding: 24px; text-align: center; color: var(--red-800); }

  /* Login */

    position: fixed; inset: 0; z-index: 90; display: none; place-items: center; padding: 20px;
    background: radial-gradient(1200px 600px at 10% -10%, var(--blue-100) 0%, transparent 60%),
                radial-gradient(900px 500px at 110% 110%, var(--sky-200) 0%, transparent 60%), var(--bg);
  }

  @keyframes authOut { to { opacity: 0; transform: scale(1.02); } }
  .auth-card {
    width: min(400px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 28px;
    padding: 32px 28px 22px; box-shadow: var(--shadow-lg); text-align: center;
    animation: rise .6s var(--ease-out) both;
  }
  .auth-card.shake { animation: shake .45s var(--ease-out); }
  @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
  .auth-mark { width: 56px; height: 56px; border-radius: 18px; margin: 0 auto 14px; }
  .auth-mark svg { width: 26px; height: 26px; }
  .auth-title { font-size: 22px; font-weight: 800; }
  .auth-sub { margin: 6px 0 20px; color: var(--muted); font-size: 13.5px; }
  .auth-form { display: grid; gap: 14px; text-align: left; }

  .auth-foot { margin: 16px 0 0; font-size: 12px; color: var(--muted); }
  .auth-checking { display: none; align-items: center; justify-content: center; gap: 10px; padding: 26px 0 30px; color: var(--muted); font-weight: 600; font-size: 13.5px; }
  .auth-screen.checking .auth-checking { display: flex; }
  .auth-screen.checking .auth-form, .auth-screen.checking .auth-foot { display: none; }
  .spin.dark { display: inline-block; width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--sky-100); border-top-color: var(--blue-600); animation: spin .7s linear infinite; }
  .user-chip { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 4px 0 6px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); }
  .avatar.xs { width: 30px; height: 30px; border-radius: 10px; font-size: 11px; box-shadow: none; }
  .user-name { font-size: 12.5px; font-weight: 700; color: var(--ink-2); white-space: nowrap; max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
  .logout-btn { width: 34px; height: 34px; border: 0; border-radius: 10px; background: var(--sky-50); color: var(--blue-700); display: grid; place-items: center; transition: background .2s, transform .2s var(--spring); }
  .logout-btn:hover { background: var(--red-100); color: var(--red-700); transform: translateX(2px); }

  /* Menu */
  .main-nav { display: flex; gap: 4px; padding: 4px; background: var(--sky-50); border: 1.5px solid var(--line); border-radius: 14px; margin-left: 8px; }
  .nav-item { position: relative; display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border: 0; border-radius: 10px; background: none; font-weight: 700; font-size: 13px; color: var(--muted); transition: background .2s, color .2s, box-shadow .2s; }

  /* Laptop widths: inactive items show only their icon (name in the tooltip). */
  @media (min-width: 641px) and (max-width: 1480px) {
    .nav-item { padding: 0 11px; }
    .nav-item:not(.active) > span:not(.nav-badge) { display: none; }

  }
  .nav-item.active { background: var(--card); color: var(--blue-700); box-shadow: var(--shadow-sm); }
  .nav-badge[hidden] { display: none; }
  .nav-badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--red-500); color: #fff; font-size: 10.5px; font-weight: 800; display: inline-grid; place-items: center; animation: pop .4s var(--spring); }
  .view-enter { animation: rise .45s var(--ease-out) both; }

  /* Meetings page */
  .meetings-view { max-width: 1040px; }
  .mt-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .eyebrow-soft { font-size: 11.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--blue-600); }
  .page-title { font-size: clamp(26px, 3.4vw, 34px); font-weight: 800; margin: 4px 0 6px; }
  .page-sub { margin: 0; font-size: 14px; max-width: 520px; }
  .mt-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
  .mt-stat { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; box-shadow: var(--shadow-sm); animation: rise .5s var(--ease-out) both; }
  .mt-stat b { display: block; font-size: 26px; font-weight: 800; color: var(--navy); letter-spacing: -.02em; }
  .mt-stat span { font-size: 12px; font-weight: 600; color: var(--muted); }
  .mt-stat.is-warn b { color: var(--red-600); }
  .mt-stat.is-ok b { color: var(--blue-600); }
  .mt-filters { display: grid; gap: 12px; margin-bottom: 18px; padding: 14px 16px; }
  .mt-filter-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .mt-search { position: relative; flex: 1; min-width: 200px; display: flex; align-items: center; }
  .mt-search .i { position: absolute; left: 12px; color: var(--muted); }
  .mt-search input, .mt-filter-row select { height: 40px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); font: inherit; font-size: 13.5px; color: var(--ink); }
  .mt-search input { width: 100%; padding: 0 12px 0 38px; }
  .mt-filter-row select { padding: 0 12px; font-weight: 600; }
  .mt-search input:focus, .mt-filter-row select:focus { outline: none; border-color: var(--sky-400); box-shadow: 0 0 0 4px rgba(56,189,248,.18); }
  .chip.is-warn:not(.active) { border-color: var(--red-200); color: var(--red-700); background: var(--red-50); }
  .mt-list { display: grid; gap: 12px; }
  .mt-month { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--blue-600); margin: 10px 2px 0; }
  .mt-card { display: grid; grid-template-columns: 64px 1fr; gap: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; box-shadow: var(--shadow-sm); animation: rise .45s var(--ease-out) both; transition: box-shadow .2s, border-color .2s; }
  .mt-card:hover { box-shadow: var(--shadow); border-color: var(--sky-200); }
  .mt-card.st-overdue { border-left: 4px solid var(--red-400); }
  .mt-card.st-done { border-left: 4px solid var(--sky-300); }
  .mt-date { width: 64px; height: 64px; border-radius: 16px; background: var(--grad); color: #fff; display: grid; place-content: center; text-align: center; box-shadow: 0 8px 18px -10px rgba(37,99,235,.8); }
  .mt-date b { font-size: 24px; line-height: 1; font-weight: 800; }
  .mt-date span { font-size: 11px; font-weight: 700; text-transform: uppercase; opacity: .9; margin-top: 3px; }
  .mt-main { min-width: 0; }
  .mt-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .mt-cat { font-size: 12px; font-weight: 800; color: var(--blue-700); background: var(--sky-100); padding: 4px 10px; border-radius: 999px; }
  .mt-actions { margin-left: auto; display: flex; gap: 4px; }
  .icon-sm { width: 32px; height: 32px; border-radius: 10px; border: 0; background: var(--sky-50); color: var(--blue-700); display: grid; place-items: center; transition: background .2s, transform .2s var(--spring); }
  .icon-sm .i { width: 16px; height: 16px; }
  .icon-sm:hover { background: var(--sky-100); transform: translateY(-1px); }
  .icon-sm.danger:hover { background: var(--red-100); color: var(--red-700); }
  .mt-people { margin-top: 10px; }
  .mt-purpose { margin: 10px 0 0; font-size: 14px; line-height: 1.55; color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; }
  .tasks { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 6px; }
  .task { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: var(--sky-50); font-size: 13.5px; flex-wrap: wrap; transition: background .2s; }
  .task.done .t-text { text-decoration: line-through; color: var(--muted); }
  .task.overdue { background: var(--red-50); }
  .t-text { flex: 1; min-width: 140px; font-weight: 600; overflow-wrap: anywhere; }
  .tick { width: 26px; height: 26px; flex-shrink: 0; border-radius: 8px; border: 2px solid var(--slate-300); background: var(--card); display: grid; place-items: center; color: transparent; transition: all .2s var(--spring); }
  .tick .i { width: 15px; height: 15px; stroke-width: 3; }
  .tick:hover { border-color: var(--sky-400); }
  .tick[aria-pressed="true"], .tick.on { background: var(--blue-600); border-color: var(--blue-600); color: #fff; transform: scale(1.04); }
  .tick:disabled { opacity: .6; }
  .due { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; color: var(--muted); white-space: nowrap; }
  .due .i { width: 13px; height: 13px; }
  .due.soon { color: var(--amber-700); }
  .due.overdue { color: var(--red-600); }
  .mt-progress { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 12px; font-weight: 700; color: var(--muted); }
  .mt-progress .bar { flex: 1; height: 6px; }
  .mt-empty { display: grid; justify-items: center; gap: 6px; padding: 46px 16px; text-align: center; background: var(--card); border: 1.5px dashed var(--sky-200); border-radius: 20px; color: var(--muted); font-size: 13px; }
  .mt-empty .i { width: 34px; height: 34px; color: var(--sky-400); margin-bottom: 4px; }
  .mt-empty b { color: var(--ink); font-size: 15px; }

  /* Meeting form */
  .mt-wrap { z-index: 62; }

  .mt-form .form-grid { margin-bottom: 4px; }
  .mt-form .field.invalid .picker .pick-chips, .mt-form .field.invalid textarea, .mt-form .field.invalid input { border-color: var(--red-400); background: var(--red-50); }
  .picker { position: relative; }
  .pick-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 46px; padding: 6px 8px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); transition: border-color .2s, box-shadow .2s; }
  .pick-chips:focus-within { border-color: var(--sky-400); box-shadow: 0 0 0 4px rgba(56,189,248,.18); }
  .pick-chips input { flex: 1; min-width: 140px; border: 0 !important; box-shadow: none !important; height: 32px !important; padding: 0 4px !important; background: transparent !important; }
  .pick-chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 3px; border-radius: 999px; background: var(--sky-100); font-size: 12.5px; font-weight: 700; color: var(--blue-700); animation: pop .3s var(--spring); }
  .pick-chip button { width: 20px; height: 20px; border: 0; border-radius: 50%; background: var(--chip-btn); color: var(--blue-700); display: grid; place-items: center; }
  .pick-chip button .i { width: 12px; height: 12px; }
  .dot { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-size: 9.5px; font-weight: 800; flex-shrink: 0; }
  .pick-list { position: absolute; z-index: 5; top: calc(100% + 6px); left: 0; right: 0; max-height: 260px; overflow-y: auto; background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-lg); padding: 6px; display: none; }
  .pick-list.open { display: block; animation: rise .2s var(--ease-out); }
  .pick-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; background: none; border-radius: 10px; text-align: left; }
  .pick-item:hover { background: var(--sky-50); }
  .pick-item .dot { width: 30px; height: 30px; font-size: 11px; }
  .pick-item .pr-name, .pick-item .pr-sub { display: block; }
  .task-edit { display: grid; gap: 8px; }
  .task-row { display: grid; grid-template-columns: 26px 1fr 150px 32px; gap: 8px; align-items: center; animation: rise .3s var(--ease-out) both; }
  .task-row input { height: 40px; padding: 0 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); font: inherit; font-size: 13.5px; font-weight: 600; color: var(--ink); min-width: 0; }
  .task-row input:focus { outline: none; border-color: var(--sky-400); box-shadow: 0 0 0 4px rgba(56,189,248,.18); }
  .add-task { display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; text-decoration: none; }
  .add-task .i { width: 15px; height: 15px; }

  /* Meetings in a person's profile */
  .h4-action { float: right; display: inline-flex; align-items: center; gap: 3px; padding: 0; text-transform: none; letter-spacing: 0; font-size: 12px; text-decoration: none; }
  .h4-action .i { width: 14px; height: 14px; }
  .pm-item { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 12px; margin-bottom: 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); transition: border-color .2s, transform .2s var(--spring); }
  .pm-item:hover { border-color: var(--sky-300); transform: translateX(2px); }
  .pm-date { font-size: 12px; font-weight: 800; color: var(--blue-700); white-space: nowrap; min-width: 48px; }
  .pm-main { flex: 1; min-width: 0; display: grid; }
  .pm-main b { font-size: 12.5px; }
  .pm-main span { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge.is-warn { background: var(--red-100); color: var(--red-700); }

  /* LDP */
  .ldp-list { display: grid; gap: 10px; }
  .ldp-card { display: grid; grid-template-columns: minmax(200px, 1.1fr) minmax(280px, 1.5fr) minmax(160px, 1fr) auto; gap: 16px; align-items: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; box-shadow: var(--shadow-sm); animation: rise .45s var(--ease-out) both; }
  .ldp-card.st-overdue { border-left: 4px solid var(--red-400); }
  .ldp-card.st-done { border-left: 4px solid var(--sky-300); }
  .ldp-who { display: flex; align-items: center; gap: 10px; min-width: 0; border: 0; background: none; padding: 0; text-align: left; }
  .ldp-who .pr-main { flex: 1; min-width: 0; display: grid; }
  .ldp-path { min-width: 0; }
  .stepper { list-style: none; margin: 0; padding: 0; display: flex; }
  .st { position: relative; flex: 1; display: grid; justify-items: center; gap: 4px; font-size: 10.5px; font-weight: 700; color: var(--muted); text-align: center; }
  .st:not(:last-child)::after { content: ''; position: absolute; top: 9px; left: calc(50% + 12px); right: calc(-50% + 12px); height: 2px; background: var(--line); }
  .st.done:not(:last-child)::after { background: var(--sky-300); }
  .st-dot { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--card); border: 2px solid var(--slate-300); color: #fff; z-index: 1; }
  .st-dot .i { width: 12px; height: 12px; stroke-width: 3.5; }
  .st.done .st-dot { background: var(--blue-600); border-color: var(--blue-600); }
  .st.done { color: var(--blue-700); }
  .st.current .st-dot { border-color: var(--sky-400); box-shadow: 0 0 0 4px rgba(56,189,248,.25); animation: pulseRing 2s infinite; }
  .st.current { color: var(--ink); }
  @keyframes pulseRing { 50% { box-shadow: 0 0 0 7px rgba(56,189,248,0); } }
  .ldp-now { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; justify-content: center; }
  .ldp-next { font-size: 12px; color: var(--muted); }
  .ldp-next b { color: var(--ink); }
  .ldp-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; padding: 4px 9px; border-radius: 999px; background: var(--sky-50); color: var(--blue-700); white-space: nowrap; }
  .ldp-chip .i { width: 12px; height: 12px; }
  .ldp-chip.bad { background: var(--red-100); color: var(--red-700); }
  .ldp-chip.soon { background: var(--amber-100); color: var(--amber-800); }
  .ldp-chip.ok { background: var(--green-100); color: var(--emerald-700); }
  .ldp-chip.muted { background: var(--slate-100); color: var(--slate-500); }
  .ldp-last { display: grid; gap: 2px; font-size: 12px; min-width: 0; padding: 8px 10px; border-radius: 12px; background: var(--sky-50); }
  .ldp-last.berhasil { background: var(--green-50); }
  .ldp-last.belum { background: var(--amber-50); }
  .ldp-last.none { color: var(--muted); background: var(--slate-50); }
  .ldp-last-head { font-weight: 800; color: var(--ink-2); }
  .ldp-last-note { color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ldp-update { height: 38px; padding: 0 14px; }
  .ldp-focus { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 14px; border-radius: 14px; background: var(--sky-50); margin-bottom: 12px; font-size: 14px; }
  .ldp-focus.done { color: var(--emerald-700); background: var(--green-50); font-weight: 700; }
  .ldp-focus .i { width: 16px; height: 16px; }
  .ldp-result .chip { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; }
  .ldp-result .chip .i { width: 15px; height: 15px; stroke-width: 3; }
  .ldp-result .chip.active.bad { background: var(--red-600); border-color: var(--red-600); box-shadow: 0 6px 14px -6px rgba(220,38,38,.6); }
  .ldp-sub { margin-top: 12px; animation: rise .3s var(--ease-out) both; }
  .ldp-table { display: grid; gap: 6px; }
  .ldp-tr { display: grid; grid-template-columns: 130px 1fr 1fr; gap: 10px; align-items: start; padding: 6px 8px; border-radius: 12px; }
  .ldp-tr.head { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding-bottom: 0; }
  .ldp-tr.current { background: var(--sky-50); }
  .ldp-tr input { width: 100%; height: 38px; padding: 0 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); }
  .ldp-tr input:focus, .ldp-sub input:focus { outline: none; border-color: var(--sky-400); box-shadow: 0 0 0 4px rgba(56,189,248,.18); }
  .ldp-step { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; padding-top: 10px; }
  .ldp-step .i { width: 14px; height: 14px; color: var(--blue-600); stroke-width: 3; }
  .ldp-tr .hint { display: block; }
  .ldp-sub input { width: 100%; }
  .ldp-hist { display: grid; grid-template-columns: 92px 1fr; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); margin-bottom: 6px; font-size: 13px; }
  .ldp-hist.berhasil { border-left: 4px solid #34d399; }
  .ldp-hist.belum { border-left: 4px solid var(--amber-400); }
  .ldp-hist-date { font-weight: 800; color: var(--blue-700); font-size: 12px; }
  .ldp-hist-main { display: grid; gap: 2px; min-width: 0; overflow-wrap: anywhere; }
  .ldp-err { margin-right: auto; align-self: center; font-size: 12.5px; font-weight: 700; color: var(--red-600); }

  /* Lokasi */
  .loc-view { max-width: 1240px; }
  .loc-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
  .loc-map-card { padding: 12px; display: grid; gap: 10px; }
  .loc-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
  .loc-tools .chip { display: inline-flex; align-items: center; gap: 6px; }
  .loc-tools .chip .i { width: 15px; height: 15px; }
  .coach-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .loc-map-box { position: relative; }
  .loc-map { height: min(64vh, 620px); min-height: 360px; border-radius: 14px; overflow: hidden; background: var(--surface-2); z-index: 0; }
  .loc-map-msg[hidden] { display: none; }
  .loc-map-msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; color: var(--muted); font-weight: 600; background: rgba(238,244,251,.92); border-radius: 14px; }
  .loc-side { padding: 12px; display: grid; gap: 10px; max-height: calc(min(64vh, 620px) + 70px); overflow: hidden; grid-template-rows: auto 1fr; }
  .loc-list { overflow-y: auto; display: grid; gap: 4px; align-content: start; padding-right: 2px; }
  .loc-group { display: grid; gap: 4px; margin-bottom: 8px; }
  .loc-group-title { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--blue-600); margin: 4px 4px 2px; }
  .loc-group-title span { color: var(--muted); }
  .loc-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 10px; border: 1px solid transparent; border-radius: 12px; background: none; transition: background .2s, border-color .2s; }
  .loc-item:hover { background: var(--sky-50); }
  .loc-item.focus { background: var(--sky-50); border-color: var(--sky-200); }
  .loc-item .pr-main { flex: 1; min-width: 0; display: grid; }
  .loc-badge { flex-shrink: 0; font-size: 11px; font-weight: 800; color: #fff; background: var(--c); padding: 4px 8px; border-radius: 8px; white-space: nowrap; }
  .loc-go { color: var(--blue-600); display: grid; }
  .loc-go .i { width: 16px; height: 16px; }
  .loc-set { font-size: 11.5px; font-weight: 800; color: var(--amber-700); background: var(--amber-100); padding: 4px 8px; border-radius: 8px; white-space: nowrap; }
  .loc-none { color: var(--muted); }
  .cg-map-link { display: inline-flex; align-items: center; gap: 3px; padding: 0; font-size: 12px; text-decoration: none; }
  .cg-map-link .i { width: 13px; height: 13px; }
  /* map pins */
  .loc-pin-wrap { background: none; border: 0; }
  .loc-pin { width: 34px; height: 34px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--c); border: 3px solid var(--card);
    box-shadow: 0 6px 14px -4px rgba(11,42,111,.55); display: grid; place-items: center; transition: transform .2s var(--spring); }
  .loc-pin span { transform: rotate(45deg); color: #fff; font-size: 10.5px; font-weight: 800; letter-spacing: -.02em; }
  .leaflet-marker-icon:hover .loc-pin { transform: rotate(-45deg) scale(1.12); }
  /* Leaflet popups in the app's style */
  .leaflet-container { font-family: inherit; }
  .leaflet-popup-content-wrapper { border-radius: 16px; box-shadow: var(--shadow-lg); }
  .leaflet-popup-content { margin: 14px 16px; }
  .loc-pop { display: grid; gap: 6px; font-size: 13px; color: var(--ink); min-width: 220px; }
  .loc-pop-head { display: flex; align-items: center; gap: 8px; }
  .loc-pop-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .btn.sm { height: 32px; padding: 0 10px; font-size: 12px; border-radius: 10px; gap: 5px; }
  .btn.sm .i { width: 14px; height: 14px; }
  .leaflet-popup-content a.btn.primary { color: #fff; }
  .leaflet-popup-content a.btn:not(.primary) { color: var(--ink); }
  /* edit form */
  .loc-input-row { display: flex; gap: 8px; }

  /* CG overview page */

  .cg-hero { position: relative; overflow: hidden; display: grid; grid-template-columns: 1fr 1.1fr; gap: 24px; align-items: center;
    padding: clamp(20px, 3.5vw, 30px); border-radius: 26px; color: #fff; box-shadow: var(--shadow-lg);

  .cg-info-chips { display: flex; flex-wrap: wrap; gap: 6px; }

  .cg-info-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
  .cg-info .legend { margin-top: 4px; }

  .cg-panel { padding: 0 0 6px; }
  .cg-tabs { margin: 14px 14px 0; position: relative; }

  .cg-open-btn { align-self: flex-start; flex-shrink: 0; }

  /* Pindah CG / Hapus */

  .danger-btn:hover { background: var(--red-100); }
  .danger-btn.solid { background: var(--red-600); border-color: var(--red-600); color: #fff; box-shadow: 0 8px 18px -8px rgba(220,38,38,.7); }
  .danger-btn.solid:hover { background: var(--red-700); }
  .danger-btn .spin { border-color: rgba(255,255,255,.4); border-top-color: #fff; }

  .rs-warn .i { width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; }

  .rs-options { display: grid; gap: 6px; max-height: 340px; overflow-y: auto; padding: 2px; }
  .rs-option { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--card); transition: border-color .2s, background .2s; }
  .rs-option:hover { border-color: var(--sky-300); }

  @media (max-width: 960px) {
    .cg-hero { grid-template-columns: 1fr; }
    .cg-info-grid { grid-template-columns: 1fr; }
    .loc-layout { grid-template-columns: 1fr; }
    .loc-side { max-height: none; }
    .loc-list { max-height: 420px; }
    .ldp-card { grid-template-columns: 1fr 1.4fr auto; }
    .ldp-last { grid-column: 1 / -1; grid-row: 2; }
    .hero { grid-template-columns: 1fr; }
    .grid-2 { grid-template-columns: 1fr; }
  }
  @media (max-width: 640px) {
    .topbar { flex-wrap: wrap; gap: 10px; }
    .search { order: 3; max-width: none; flex-basis: 100%; }
    .brand { flex: 1; }
    .brand > div:last-child { min-width: 0; }
    .brand-sub { overflow: hidden; text-overflow: ellipsis; }

    .top-actions { margin-left: auto; gap: 6px; }

    .main-nav { position: fixed; z-index: 40; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); margin: 0; justify-content: space-around; background: var(--glass-strong); backdrop-filter: blur(12px); box-shadow: var(--shadow-lg); border-radius: 18px; }
    .nav-item { flex: 1 1 0; min-width: 0; justify-content: center; height: 46px; flex-direction: column; gap: 2px; font-size: 10px; padding: 0 2px; }
    .nav-item > span:not(.nav-badge) { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
    .nav-item > span[data-short] { font-size: 0; }
    .nav-item > span[data-short]::after { content: attr(data-short); font-size: 10px; }
    .main-nav { left: 8px; right: 8px; gap: 2px; }
    .nav-item .nav-badge { position: absolute; top: 4px; right: calc(50% - 26px); }
    body:not(.signed-out) { padding-bottom: 84px; }
    .topbar { backdrop-filter: none; -webkit-backdrop-filter: none; background: var(--glass-solid); } /* a blurred header would trap the fixed menu */
    .toast { bottom: calc(86px + env(safe-area-inset-bottom)); }
    .mt-stats { grid-template-columns: repeat(2, 1fr); }
    .mt-card { grid-template-columns: 1fr; }
    .mt-date { width: auto; height: auto; padding: 6px 12px; display: inline-flex; gap: 6px; align-items: baseline; justify-self: start; border-radius: 12px; }
    .mt-date b { font-size: 18px; }
    .task-row { grid-template-columns: 26px 1fr 32px; }
    .task-row .d-in { grid-column: 2 / 3; }
    .ldp-card { grid-template-columns: 1fr auto; gap: 12px; }
    .ldp-path, .ldp-last { grid-column: 1 / -1; }
    .ldp-update { grid-row: 1; grid-column: 2; }
    .ldp-tr { grid-template-columns: 1fr 1fr; }
    .ldp-tr .ldp-step { grid-column: 1 / -1; padding-top: 0; }
    .ldp-tr.head span:first-child { display: none; }
    .drawer { border-radius: 0; }
    .drawer-stats { grid-template-columns: repeat(2, 1fr); }
    .info-grid { grid-template-columns: 1fr; }
    .modal-wrap { place-items: end center; padding: 0; }
    .modal { border-radius: 26px 26px 0 0; max-height: 92vh; transform: translateY(100%); transition: opacity .2s, transform .5s var(--ease-out); }
    .stat-num { font-size: 26px; }
    .ms-head { grid-template-columns: 90px 1fr 48px; }
  }

  /* Multiplikasi */
  .cg-hero-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .cg-hero-actions .cg-edit-btn { margin-top: 0; }
  .mul-flow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .mul-cg { font-weight: 800; font-size: 14px; padding: 6px 11px; border-radius: 12px; border: 0; white-space: nowrap; }
  .mul-cg.src { background: var(--sky-50); color: var(--blue-700); border: 1.5px solid var(--sky-200); }
  .mul-cg.new { background: var(--grad); color: #fff; box-shadow: 0 6px 14px -8px rgba(37,99,235,.8); }
  button.mul-cg.new { cursor: pointer; transition: transform .2s var(--spring); }
  button.mul-cg.new:hover { transform: translateY(-1px) scale(1.03); }
  .mul-arrow { color: var(--sky-400); display: grid; animation: mulNudge 1.6s ease-in-out infinite; }
  @keyframes mulNudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(3px); } }
  .mul-flow .mt-cat { margin-left: auto; }
  .mul-leader { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 13.5px; color: var(--ink-2); }
  .mul-leader .i { width: 16px; height: 16px; color: var(--amber-500); fill: var(--amber-200); }
  .mul-names { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .mul-names span { font-size: 12px; font-weight: 700; color: var(--blue-700); background: var(--sky-50); padding: 3px 9px; border-radius: 999px; }
  .mul-by { margin-top: 8px; font-size: 11.5px; color: var(--muted); }

  .mul-head .avatar { background: linear-gradient(135deg, var(--emerald-500), var(--sky-400)); }
  .mul-head .avatar .i { width: 26px; height: 26px; color: #fff; }
  .mul-step { display: flex; align-items: center; gap: 8px; margin: 18px 0 10px; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--navy); }
  .mul-step:first-child { margin-top: 0; }
  .mul-step > span:first-child { width: 22px; height: 22px; border-radius: 50%; background: var(--grad); color: #fff; display: grid; place-items: center; font-size: 11px; letter-spacing: 0; }
  .mul-count { margin-left: auto; font-size: 11.5px; letter-spacing: 0; text-transform: none; color: var(--blue-600); background: var(--sky-100); padding: 3px 9px; border-radius: 999px; }
  .mul-select { width: 100%; height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); font: inherit; font-size: 14px; padding: 0 10px; color: var(--ink); }
  .mul-select:focus { outline: none; border-color: var(--sky-400); box-shadow: 0 0 0 4px rgba(56,189,248,.18); }
  .mul-select:disabled { background: var(--slate-50); color: var(--muted); }
  .field label .opt { font-weight: 600; color: var(--slate-400); text-transform: none; }
  .mul-picked { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1.5px solid var(--blue-600); border-radius: 14px; background: var(--sky-50); animation: pop .3s var(--spring); }
  .mul-picked .dot { width: 32px; height: 32px; font-size: 11px; }
  .mul-picked .pr-main { display: grid; }
  .mul-modal .pick-chips > .i { color: var(--muted); margin-left: 4px; }
  .mul-modal .rs-warn { margin-top: 10px; }
  .mul-all { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; color: var(--blue-700); margin-bottom: 8px; cursor: pointer; }
  .mul-checks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .mul-check { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); cursor: pointer; transition: border-color .2s, background .2s; min-width: 0; }
  .mul-check:hover { border-color: var(--sky-300); }
  .mul-check.on { border-color: var(--blue-600); background: var(--sky-50); }
  .mul-check .pr-main { display: grid; }
  .mul-check input, .mul-all input { width: 18px; height: 18px; accent-color: var(--blue-600); flex-shrink: 0; }
  @media (max-width: 640px) { .mul-checks { grid-template-columns: minmax(0, 1fr); } .mul-flow .mt-cat { margin-left: 0; } }


  /* Visit CG */
  .vs-head-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .vs-card .mt-top .cg-code { font-size: 12px; padding: 6px 9px; }
  .vs-cgl { font-weight: 700; font-size: 14px; color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
  .vs-meta { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; margin-top: 8px; }
  .vs-who { font-size: 11.5px; font-weight: 800; color: var(--blue-700); background: var(--sky-100); padding: 3px 9px; border-radius: 999px; }
  .vs-who.tl { color: var(--violet-700); background: var(--violet-100); }
  .vs-who.admin { color: var(--teal-700); background: var(--teal-100); }
  .vs-ro { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; color: var(--muted); }
  .vs-ro .i { width: 13px; height: 13px; }
  .vs-card .mt-actions { align-items: center; }
  .vs-hint { margin-top: 10px; font-size: 12.5px; color: var(--red-700); background: var(--red-50); padding: 8px 10px; border-radius: 10px; }
  .vs-block { margin-top: 12px; padding: 10px 12px; border-radius: 14px; background: var(--sky-50); }

  .mt-list.vs-cover { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .vs-cg { background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--sky-300); border-radius: 18px; padding: 14px; box-shadow: var(--shadow-sm); display: grid; gap: 12px; animation: rise .45s var(--ease-out) both; min-width: 0; }

    .vs-head-btns .btn { flex: 1; justify-content: center; }

  }


  /* CG health */
  .hl-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; vertical-align: middle; white-space: nowrap; }
  .hl-badge i, .hl-chip i, .cc-health i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .hl-badge.green { background: var(--green-100); color: var(--green-700); } .hl-badge.green i, .hl-chip.green i, .cc-health .green i { background: var(--green-500); }
  .hl-badge.yellow { background: var(--yellow-100); color: var(--yellow-700); } .hl-badge.yellow i, .hl-chip.yellow i, .cc-health .yellow i { background: var(--yellow-500); }
  .hl-badge.red { background: var(--red-100); color: var(--red-700); } .hl-badge.red i, .hl-chip.red i, .cc-health .red i { background: var(--red-500); }

  .hl-badge.multi .i { width: 11px; height: 11px; }

  .hl-panel { display: grid; gap: 14px; }
  .hl-bar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--sky-50); }
  .hl-bar i { display: block; height: 100%; transition: width .6s var(--ease-out); }
  .hl-bar .green { background: var(--green-500); } .hl-bar .yellow { background: var(--yellow-500); } .hl-bar .red { background: var(--red-500); }
  .hl-tools { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .hl-select { height: 38px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); font: inherit; font-size: 13px; font-weight: 600; padding: 0 10px; color: var(--ink); }
  .hl-scroll { max-height: 560px; overflow: auto; border: 1px solid var(--line); border-radius: 14px; margin: 0; padding: 0; }
  .hl-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .hl-table thead th { position: sticky; top: 0; z-index: 1; background: var(--sky-50); text-align: left; font-size: 11.5px; font-weight: 800; color: var(--muted); border-bottom: 1px solid var(--line); padding: 0; white-space: nowrap; }
  .hl-table th button { all: unset; display: flex; align-items: center; gap: 4px; padding: 10px 12px; cursor: pointer; width: 100%; box-sizing: border-box; }
  .hl-table th.num button { justify-content: flex-end; }
  .hl-table th.sorted { color: var(--blue-700); }
  .hl-table th button:focus-visible { outline: 2px solid var(--sky-400); outline-offset: -2px; }
  .hl-table th > :not(button), .hl-table thead th:last-child { padding: 10px 12px; }
  .hl-arrow { font-size: 9px; }
  .hl-arrow:empty { display: none; }
  .hl-table td { padding: 9px 12px; border-bottom: 1px solid var(--slate-150); vertical-align: middle; white-space: nowrap; }
  .hl-table tbody tr { cursor: pointer; transition: background .15s; }
  .hl-table tbody tr:hover, .hl-table tbody tr:focus-visible { background: var(--sky-50); outline: none; }
  .hl-table tbody tr td:first-child { border-left: 4px solid transparent; }
  .hl-table tr.green td:first-child { border-left-color: var(--green-500); }
  .hl-table tr.yellow td:first-child { border-left-color: var(--yellow-500); }
  .hl-table tr.red td:first-child { border-left-color: var(--red-500); }
  .hl-table .hl-code { font-weight: 800; color: var(--blue-700); }
  .hl-table .hl-name { font-weight: 600; }

  .hl-table td.num.bad { color: var(--red-600); } .hl-table td.num.meh { color: var(--yellow-700); } .hl-table td.num.up { color: var(--blue-600); }
  .hl-table .hl-why { white-space: normal; min-width: 220px; color: var(--ink-2); font-size: 12.5px; }
  .hl-table .hl-why .ok { color: var(--green-700); font-weight: 700; }

  .cc-health span { display: inline-flex; align-items: center; gap: 5px; }
  .cc-health .multi { color: var(--blue-600); }

  .vi-list { display: grid; gap: 16px; }
  .vi-card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 18px; box-shadow: var(--shadow-sm); display: grid; gap: 14px; animation: rise .5s var(--ease-out) both; min-width: 0; }
